<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eDaptiva fejlrapport</title>
<style>
:root{--ink:#1d2329;--ink2:#4a545e;--muted:#79838d;--line:#e2e6ea;--bg:#f4f6f8;--card:#fff;--accent:#00a37a;--accent-ink:#fff;
--err:#b42318;--err-bg:#fdecea;--ok:#1e7a46;--ok-bg:#e5f4ea;--crit:#b42318;--crit-bg:#fdecea;--warn:#8a6100;--warn-bg:#fdf6d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 64px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:8px}
.lang{display:inline-flex;border:1px solid #c9d0d6;border-radius:8px;overflow:hidden;background:#fff}
.lang button{background:#fff;color:var(--ink2);border-radius:0;padding:6px 12px;font-size:13px;font-weight:600}
.lang button.on{background:var(--ink);color:#fff}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
header.top h1{margin:0;font-size:22px}
header.top .who{color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:16px}
.login{max-width:420px;margin:24px auto}
.login h2{margin:0 0 4px;font-size:20px}
.login p.sub{margin:0 0 18px;color:var(--ink2);font-size:14px}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
input[type=text],input[type=password],input[type=date],select{width:100%;padding:9px 11px;border:1px solid #c9d0d6;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
button{font:inherit;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.secondary{background:#e9edf0;color:var(--ink)}
button.link{background:none;color:var(--accent);padding:10px 4px;font-weight:600}
button:disabled{opacity:.55;cursor:default}
.btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1 1 170px}
.checks{display:flex;gap:18px;padding:8px 0}
.checks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:15px}
.msg{padding:10px 12px;border-radius:7px;font-size:14px;margin-top:14px;display:none}
.msg.err{display:block;background:var(--err-bg);color:var(--err)}
.msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.msg.info{display:block;background:#eef3f8;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:4px 0 18px}
.tile{background:var(--bg);border-radius:8px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--ink2)}.tile .v{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--ink2);font-weight:600;border-bottom:2px solid var(--line);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right}
.sev{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.sev-4{color:var(--crit);background:var(--crit-bg)}.sev-3{color:var(--warn);background:var(--warn-bg)}
.small{font-size:12px;color:var(--muted)}
h3{margin:22px 0 8px;font-size:16px}
details.diag{margin-top:28px;font-size:13px;color:var(--ink2)}
details.diag pre{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;max-height:300px;overflow:auto}
.hidden{display:none!important}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:8px}
.rep-head{border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.rep-head h2{margin:0;font-size:22px}.rep-head .sub{color:var(--ink2);font-size:14px}
.report h3{font-size:17px;margin:28px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.up{color:var(--crit)}.down{color:var(--ok)}
ul.insights{margin:0;padding:0;list-style:none}
ul.insights li{padding:10px 12px 10px 14px;border-left:4px solid var(--ink2);background:var(--bg);border-radius:0 6px 6px 0;margin-bottom:8px}
ul.insights li.crit{border-left-color:var(--crit)}ul.insights li.warn{border-left-color:#c98a00}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 4px 1px 0}
.b-flap{color:#fff;background:var(--crit)}.b-persist{color:var(--crit);background:var(--crit-bg)}.b-rising{color:#b54708;background:#fef0e1}
.b-recur{color:var(--warn);background:var(--warn-bg)}.b-new{color:#175cd3;background:#eaf1fd}
.b-repeat{color:var(--ink);background:#e9edf0}.b-gone{color:var(--ok);background:var(--ok-bg)}
.b-offline{color:#fff;background:#8e3b8e}.b-never{color:#5b5f66;background:#e4e6ea}.b-unstable{color:#b54708;background:#fef0e1}.b-online{color:var(--ok);background:var(--ok-bg)}.b-unknown{color:var(--ink2);background:#eef1f4}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:20px;vertical-align:middle}
.spark span{width:7px;background:#a9c2df;border-radius:1px 1px 0 0;min-height:1px}
.spark span.z{background:#e2e6ea}.spark span.cur{background:#1f4f86}
.note{font-size:13px;color:var(--ink2);background:var(--bg);padding:8px 12px;border-radius:6px;margin:8px 0}
code{font-size:13px}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:12px;white-space:nowrap}
.cat svg{flex:none}
.cat-lamp{color:#8a6200}.cat.cat-lamp{background:#fdf3d6}
.cat-det{color:#2459a8}.cat.cat-det{background:#e7effa}
.cat-sys{color:#1d8279}.cat.cat-sys{background:#dff3f2}
.cat-i{display:inline-flex;vertical-align:-2px;margin-right:5px}
.catbar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:4px 0 12px;gap:2px;background:#fff}
.catbar>div{color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;min-width:4px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.catcard{background:var(--bg);border-radius:8px;border-top:4px solid;padding:12px 14px}
.catcard .v{font-size:28px;font-weight:650;margin-top:6px}.catcard .d{font-size:12px;color:var(--muted)}
ul.cat-top{list-style:none;margin:8px 0 0;padding:0}ul.cat-top li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.catfilter{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.catfilter button{background:#fff;border:1px solid #c9d0d6;color:var(--ink);padding:5px 10px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.catfilter button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.catfilter button .cat{padding:0;background:none}
.tlc-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tlc-legend .cat{margin-right:4px}
.tlc-top{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
.tlc-map{height:430px;border-radius:8px;border:1px solid var(--line);background:#eef1f4;z-index:0}
.tlc-nomap{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink2);font-size:14px;padding:20px;text-align:center}
.tlc-panel{background:var(--bg);border-radius:8px;padding:14px;min-height:200px;font-size:14px;overflow:auto;max-height:430px}
.tlc-h{font-weight:650;font-size:16px;margin-bottom:2px}
.tlc-st{color:var(--ink2);font-size:13px;margin-bottom:10px}
.tlc-kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tlc-kv>div{background:#fff;border-radius:6px;padding:8px 10px}.tlc-kv .k{font-size:12px;color:var(--ink2)}.tlc-kv .v{font-size:20px;font-weight:650}.tlc-kv .d{font-size:11px;color:var(--muted)}
ul.tlc-f{list-style:none;margin:4px 0 0;padding:0}ul.tlc-f li{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}ul.tlc-f li>span:nth-child(2){flex:1}ul.tlc-f li>.cat-i{flex:none;margin-right:0}
.tlc-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:8px 0 4px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
.c-offline{background:#8e3b8e}.c-never{background:#9aa0a6}.c-crit{background:#b42318}.c-err{background:#e07b00}.c-ok{background:#1e7a46}
table.tlc-list tr[data-tlc]{cursor:pointer}table.tlc-list tr.hl td{background:#e8f1fb}
@media (max-width:900px){.tlc-top{grid-template-columns:1fr}.tlc-map{height:340px}}
@media print{.tlc-panel{display:none}.tlc-top{grid-template-columns:1fr}}
@media print{body{background:#fff;font-size:12px}.wrap{padding:0;max-width:none}.noprint,.topbar,#view-app>header,#view-app>.card:first-of-type,details.diag{display:none!important}
 .card{border:0;padding:0;margin:0}tr,li,.tile{break-inside:avoid}h3{break-after:avoid}}
@media (max-width:600px){.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar noprint">
    <div class="lang" role="group" aria-label="Sprog / Language">
      <button type="button" data-lang="da">DK</button><button type="button" data-lang="en">EN</button>
    </div>
  </div>

  <!-- ===================== LOGIN ===================== -->
  <section id="view-login" class="card login">
    <h2 data-i18n="appTitle"></h2>
    <p class="sub" data-i18n="loginSub"></p>
    <form id="login-form" autocomplete="on">
      <label for="site" data-i18n="instance"></label>
      <select id="site" name="site"></select>
      <label for="username" data-i18n="username"></label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password" data-i18n="password"></label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="twofa-box" class="hidden">
        <label for="twofa" data-i18n="twofa"></label>
        <input id="twofa" name="twofa" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      </div>
      <div class="btnrow">
        <button id="login-btn" type="submit" data-i18n="loginBtn"></button>
        <button id="saved-btn" type="button" class="link hidden" data-i18n="savedLogin"></button>
      </div>
      <div id="login-msg" class="msg"></div>
    </form>
  </section>

  <!-- ===================== APP ===================== -->
  <section id="view-app" class="hidden">
    <header class="top">
      <h1 data-i18n="appTitle"></h1>
      <div class="who"><span id="who"></span> &nbsp;<button class="secondary" id="logout-btn" type="button" data-i18n="logout"></button></div>
    </header>

    <div class="card">
      <form id="query-form">
        <div class="row">
          <div id="area-box" class="hidden"><label for="area" data-i18n="area"></label><select id="area"></select></div>
          <div><label for="from" data-i18n="from"></label><input id="from" type="date" required></div>
          <div><label for="to" data-i18n="to"></label><input id="to" type="date" required></div>
          <div>
            <label data-i18n="severity"></label>
            <div class="checks">
              <label><input type="checkbox" id="sev-4" checked> Critical error</label>
              <label><input type="checkbox" id="sev-3" checked> Error</label>
            </div>
          </div>
          <div style="flex:0 0 auto"><button id="fetch-btn" type="submit" data-i18n="fetchBtn"></button></div>
        </div>
        <div id="fetch-msg" class="msg"></div>
      </form>
    </div>

    <div id="result" class="card report hidden">
      <div class="noprint actions">
        <button type="button" id="mail-btn" data-i18n="email"></button>
        <button type="button" id="print-btn" class="secondary" data-i18n="print"></button>
        <button class="secondary" id="dl-json" type="button" data-i18n="json"></button>
      </div>
      <div id="report"></div>
    </div>
  </section>

  <details class="diag"><summary><span data-i18n="diag"></span> · <span id="version"></span></summary><pre id="diag"></pre></details>
</div>
<script>

<script>
"use strict";
/* ===================================================================
   INTERACTIVE MAP + LIST
   mountMap() is self-contained (uses only its arguments and window.L
   from Leaflet), so the same code can be embedded in the e-mailed file.
=================================================================== */
const LEAFLET_CSS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
const LEAFLET_JS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
let leafletPromise = null;
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve(true);
  if (leafletPromise) return leafletPromise;
  leafletPromise = new Promise((resolve) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = LEAFLET_CSS; document.head.appendChild(css);
    const s = document.createElement("script"); s.src = LEAFLET_JS;
    s.onload = () => resolve(true); s.onerror = () => { leafletPromise = null; resolve(false); };
    document.head.appendChild(s);
  });
  return leafletPromise;
}

function mountMap(root, D) {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const COL = { offline: "#8e3b8e", never: "#9aa0a6", crit: "#b42318", err: "#e07b00", ok: "#1e7a46" };
  const CC = D.catColor, CATS = ["lamp", "det", "sys"];
  const panel = root.querySelector(".tlc-panel"), mapEl = root.querySelector(".tlc-map");
  const rows = [...root.querySelectorAll("[data-tlc]")];
  const T = D.T;
  let pinned = null, hovered = null;
  const markers = {};

  function chart(daily, dc) {
    const W = 330, H = 120, Lp = 26, B = 22, Tp = 8, n = daily.length, ih = H - B - Tp, cw = (W - Lp) / n;
    const mx = Math.max(1, ...daily), top = mx <= 4 ? 4 : mx <= 10 ? Math.ceil(mx / 2) * 2 : Math.ceil(mx / 10) * 10;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(T.daily)}">`;
    s += `<rect x="${Lp + D.pIdx * cw}" y="${Tp}" width="${(n - D.pIdx) * cw}" height="${ih}" fill="#eef3f8"/>`;
    for (const v of [0, top]) { const y = Tp + ih - v / top * ih; s += `<line x1="${Lp}" x2="${W}" y1="${y}" y2="${y}" stroke="#e2e6ea"/><text x="${Lp - 4}" y="${y + 4}" font-size="10" fill="#79838d" text-anchor="end">${v.toLocaleString(D.locale)}</text>`; }
    daily.forEach((v, i) => {
      const h = v / top * ih, x = Lp + i * cw + cw * 0.15, label = D.dayLabels[i];
      let yy = Tp + ih;
      for (const c of CATS) { const hc = dc[c][i] / top * ih; if (hc <= 0) continue; yy -= hc; s += `<rect x="${x}" y="${yy}" width="${cw * 0.7}" height="${hc}" fill="${CC[c]}" fill-opacity="${i >= D.pIdx ? 1 : 0.5}"></rect>`; }
      s += `<rect x="${Lp + i * cw}" y="${Tp}" width="${cw}" height="${ih}" fill="transparent"><title>${esc(label)}: ${v.toLocaleString(D.locale)} (${CATS.map(c => `${T.cat[c]} ${dc[c][i]}`).join(", ")})</title></rect>`;
      if (i % 7 === 0 || i === D.pIdx) s += `<text x="${Lp + i * cw}" y="${H - 6}" font-size="10" fill="#4a545e"${i === D.pIdx ? ' font-weight="700"' : ""}>${esc(label)}</text>`;
    });
    return s + `<line x1="${Lp}" x2="${W}" y1="${Tp + ih}" y2="${Tp + ih}" stroke="#79838d"/></svg>`;
  }

  function render(i) {
    if (i == null) { panel.innerHTML = `<p class="small">${esc(T.hint)}</p>`; return; }
    const it = D.items[i];
    const catRow = `<div class="tlc-cats">${CATS.map(c => `<span class="cat cat-${c}">${D.icons[c]}${esc(T.cat[c])} <b>${it.cats[c].toLocaleString(D.locale)}</b></span>`).join("")}</div>`;
    const kv = [[T.events, `${it.n.toLocaleString(D.locale)}`, `${it.crit.toLocaleString(D.locale)} Critical · ${it.err.toLocaleString(D.locale)} Error`]];
    if (it.comm) kv.push([T.drops, it.drops.toLocaleString(D.locale), `${T.offline}: ${it.offTxt} · ${T.uptime}: ${it.uptimeTxt}`]);
    panel.innerHTML =
      `<div class="tlc-h"><span class="dot" style="background:${COL[it.cat]}"></span>${esc(it.name)}${pinned === i ? ` <span class="small">📌</span>` : ""}</div>` +
      `<div class="tlc-st">${esc(it.statusTxt)}</div>` +
      catRow + `<div class="tlc-kv">${kv.map(([k, v, d]) => `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`).join("")}</div>` +
      `<div class="small" style="margin-top:10px">${esc(T.daily)}</div>${chart(it.daily, it.dailyCat)}` +
      `<div class="small" style="margin-top:8px">${esc(T.faults)}</div>` +
      (it.faults.length ? `<ul class="tlc-f">${it.faults.map(f => `<li><span class="cat-i cat-${f[3]}">${D.icons[f[3]]}</span><span>${esc(f[0])}</span><b>${esc(f[1])}</b>${f[2] ? ` <span class="small">${esc(f[2])}</span>` : ""}</li>`).join("")}</ul>` : `<p class="small">${esc(T.noFaults)}</p>`) +
      (it.lat == null ? `<p class="small">${esc(T.noPosOne)}</p>` : "");
  }
  function highlight(i, on) {
    const r = rows.find(x => +x.dataset.tlc === i); if (r) r.classList.toggle("hl", on);
    const m = markers[i]; if (m) { m.setStyle(on ? { weight: 4, color: "#1d2329" } : { weight: 2, color: "#ffffff" }); if (on) m.bringToFront(); }
  }
  function enter(i) { if (hovered != null) highlight(hovered, false); hovered = i; highlight(i, true); render(i); }
  function leave(i) { highlight(i, false); hovered = null; if (pinned != null) { highlight(pinned, true); render(pinned); } else render(null); }
  function pin(i) { if (pinned != null) highlight(pinned, false); pinned = pinned === i ? null : i; if (pinned != null) highlight(pinned, true); render(pinned ?? i); }

  rows.forEach(r => {
    const i = +r.dataset.tlc;
    r.addEventListener("mouseenter", () => enter(i));
    r.addEventListener("mouseleave", () => leave(i));
    r.addEventListener("click", () => { pin(i); const m = markers[i]; if (m && map) map.panTo(m.getLatLng()); });
  });

  let map = null;
  const Lf = window.L;
  const pts = D.items.map((it, i) => [it, i]).filter(([it]) => it.lat != null);
  if (!Lf || !Lf.map) mapEl.innerHTML = `<div class="tlc-nomap">${esc(T.mapFailed)}</div>`;
  else if (!pts.length) mapEl.innerHTML = `<div class="tlc-nomap">${esc(T.noPosAll)}</div>`;
  else {
    map = Lf.map(mapEl, { scrollWheelZoom: false });
    Lf.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
    const maxN = Math.max(1, ...pts.map(([it]) => it.n));
    for (const [it, i] of pts.sort((a, b) => (a[0].cat === "ok") - (b[0].cat === "ok"))) {
      const m = Lf.circleMarker([it.lat, it.lon], { radius: 7 + 11 * Math.sqrt(it.n / maxN), color: "#ffffff", weight: 2, fillColor: COL[it.cat], fillOpacity: 0.9 })
        .bindTooltip(`<b>${esc(it.name)}</b><br>${esc(it.statusTxt)}`, { direction: "top", offset: [0, -6] }).addTo(map);
      m.on("mouseover", () => enter(i)); m.on("mouseout", () => leave(i)); m.on("click", () => pin(i));
      markers[i] = m;
    }
    if (pts.length === 1) map.setView([pts[0][0].lat, pts[0][0].lon], 15);
    else map.fitBounds(pts.map(([it]) => [it.lat, it.lon]), { padding: [30, 30], maxZoom: 16 });
    setTimeout(() => map.invalidateSize(), 200);
  }
  render(null);
}

/* ---- build the data for mountMap from the report (in the current language) ---- */
function buildMapData(r) {
  const F = L(), W = HISTORY_WEEKS;
  const firstDay = addDays(r.from, -7 * W), days = [];
  for (let d = firstDay; d <= r.to; d = addDays(d, 1)) days.push(d);
  const idx = {}; days.forEach((d, i) => idx[d] = i);
  const pIdx = idx[r.from];
  const dailyBy = {}, dailyCatBy = {};
  const zeros = () => new Array(days.length).fill(0);
  for (const e of r.hist.concat(r.cur)) {
    const i = idx[dayKey(e.t)]; if (i == null) continue;
    (dailyBy[e.ctrl] = dailyBy[e.ctrl] || zeros())[i]++;
    const dc = dailyCatBy[e.ctrl] = dailyCatBy[e.ctrl] || { lamp: zeros(), det: zeros(), sys: zeros() }; dc[e.cat][i]++;
  }
  const info = {}; for (const c of r.ctrlInfo || []) info[c.name] = c;
  const commBy = {}; if (r.comm) for (const x of r.comm.rows) commBy[x.name] = x;
  const names = new Set([...r.ctrlList.map(c => c.name), ...Object.keys(commBy)]);
  const now = Date.now();
  const items = [...names].map(name => {
    const c = r.ctrlList.find(x => x.name === name) || { n: 0, crit: 0, err: 0, avg: 0, lamp: 0, det: 0, sys: 0 };
    const cm = commBy[name], inf = info[name] || {};
    const faults = r.active.filter(f => f.ctrl === name);
    const flap = faults.some(f => f.status.includes("flap"));
    const cat = cm && cm.status === "offline" ? "offline" : cm && cm.status === "never" ? "never" : (c.crit || flap) ? "crit" : (c.n || (cm && cm.unstable)) ? "err" : "ok";
    let statusTxt = cm ? (cm.status === "offline" ? `${F.cs.offline} ${F.since} ${fmtSince(cm.since)} (${fmtDur(now - cm.since)})` : F.cs[cm.status]) : "";
    if (cm && cm.unstable) statusTxt += ` · ${F.cs.unstable}`;
    if (flap) statusTxt += ` · ${F.st.flap}`;
    statusTxt += (statusTxt ? " · " : "") + (c.n ? t("pEventsN", { n: num(c.n) }) : t("pNoFaultsShort"));
    const daily = dailyBy[name] || new Array(days.length).fill(0);
    const weeks = []; for (let w = 0; w < W; w++) weeks.unshift(daily.slice(w * 7, w * 7 + 7).reduce((a, b) => a + b, 0));
    return {
      name, lat: inf.lat ?? null, lon: inf.lon ?? null, cat, statusTxt, n: c.n, crit: c.crit, err: c.err, avg: c.avg,
      comm: !!cm, drops: cm ? cm.drops : 0, offTxt: cm ? (cm.status === "never" ? "–" : cm.offMs ? fmtDur(cm.offMs) : "0") : "", uptimeTxt: cm ? (cm.status === "never" ? "–" : pct1(cm.uptime)) : "",
      commStatus: cm ? cm.status : null, unstable: cm ? cm.unstable : false,
      faults: faults.slice(0, 6).map(f => [faultLabel(f), `${num(f.n)}×`, f.status.filter(s => s !== "repeat").map(s => F.st[s]).join(", "), f.cat]),
      daily, dailyCat: dailyCatBy[name] || { lamp: zeros(), det: zeros(), sys: zeros() }, cats: { lamp: c.lamp, det: c.det, sys: c.sys },
      weeksHist: weeks.reverse(), // newest first, like elsewhere
    };
  });
  const rank = { offline: 0, never: 1, crit: 2, err: 3, ok: 4 };
  items.sort((a, b) => rank[a.cat] - rank[b.cat] || b.n - a.n || b.drops - a.drops || a.name.localeCompare(b.name, "da"));
  return {
    locale: F.locale, pIdx, dayLabels: days.map(d => fmtD(dayStart(d))), items, catColor: CAT_COLOR, icons: CAT_ICON,
    T: { hint: t("mapHint"), events: t("tEvents"), drops: t("thDrops"), offline: t("thOffTime"), uptime: t("thUptime"), daily: t("pDaily", { w: W }),
         faults: t("pFaults"), cat: F.catShort, noFaults: t("pNoFaults"), mapFailed: t("mapFailed"), noPosAll: t("noPosAll"), noPosOne: t("noPosOne") },
  };
}

/* ---- HTML for the map section: map + detail panel + list ---- */
function renderMapSection(r) {

  const withPos = D.items.filter(i => i.lat != null).length, noPos = D.items.length - withPos;

      `<td class="n"><b>${num(it.n)}</b></td>${CATS.map(c => `<td class="n">${it.cats[c] ? num(it.cats[c]) : '<span class="small">0</span>'}</td>`).join("")}` +

    `</tbody></table></div>
  </div>`;
  return h;
}

async function activateMap(r) {

/* GPS from eDaptiva's controller list – field names are read flexibly */
function parseGps(g) {
  if (!g || typeof g !== "object") return null;
  let lat = null, lon = null;
  for (const [k, v] of Object.entries(g)) {
    const n = typeof v === "string" ? parseFloat(v.replace(",", ".")) : v;
    if (typeof n !== "number" || !isFinite(n)) continue;
    if (/^lat/i.test(k)) lat = n; else if (/^(lon|lng)/i.test(k)) lon = n;
  }
  if (lat == null && Array.isArray(g.coordinates)) [lon, lat] = g.coordinates;
  if (lat == null || lon == null || (lat === 0 && lon === 0) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}

    log("Areas:", state.areas.map(a => a.name).join(", "));
  } catch (e) {
    sel.innerHTML = `<option>${esc(t("areasFailed"))}</option>`;
    if (e.session) { msg($("login-msg"), "err", t("sessionExpired")); return logout(); }
    log("Could not load areas:", e.message);
  }
}
function fillAreas() {
  const sel = $("area"), cur = sel.value;
  let last = cur; if (!last) try { last = localStorage.getItem("edaptiva-last-area-" + state.site.id); } catch (e) {}
  sel.innerHTML = state.areas.map(a => `<option value="${esc(a.id)}"${a.id === last ? " selected" : ""}>${esc(a.name)} (${esc(t("crossingsN", { n: a.controllerIds.length }))})</option>`).join("");
}

/* --------------------------- FETCH --------------------------- */
/* "2026-11-19" + "00:00:00" -> "2026-11-19T00:00:00+01:00" in the PC's local time (handles summer time) */
function localIso(dateStr, timeStr) {
  const d = new Date(`${dateStr}T${timeStr}`);
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-", a = Math.abs(off);
  return `${dateStr}T${timeStr}${sign}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
}
/* OR-tree over the crossings' UUIDs (eDaptiva combines two conditions per OR) */
function orTree(uuids) {
  if (uuids.length === 1) return { Type: "100", Value: uuids[0], Column: "ControllerUUID" };
  const m = Math.ceil(uuids.length / 2);
  return { Type: "11", Left: orTree(uuids.slice(0, m)), Right: orTree(uuids.slice(m)) };
}
function buildFilter(from, to, sevs, page, uuids) {
  const cond = [];
  if (uuids && uuids.length) cond.push(orTree(uuids));
  if (sevs.length === 1) cond.push({ Type: "100", Value: String(sevs[0]), Column: "Severity" });
  else if (sevs.length === 2) cond.push({ Type: "11", Left: { Type: "100", Value: String(sevs[0]), Column: "Severity" }, Right: { Type: "100", Value: String(sevs[1]), Column: "Severity" } });
  cond.push({ Type: "105", Value: localIso(from, "00:00:00"), Column: "EventStampOn" });
  cond.push({ Type: "103", Value: localIso(to, "23:59:59"), Column: "EventStampOn" });
  return { Conditions: cond, Sorting: [{ Column: "EventStampOn", SortingOrder: 1 }], PageSize: PAGE_SIZE, Page: page };
}
async function apiGet(path, { timeout = API_TIMEOUT_MS, retries = 1 } = {}) {
  for (let attempt = 0; ; attempt++) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
    try {
      const res = await fetch(apiBase(state.site) + path, { headers: { "Authorization": "Bearer " + state.token, "X-Device-Id": state.deviceId }, signal: ctl.signal });
      if (res.status === 401) { const e = new Error("SESSION"); e.session = true; throw e; }
      if (res.status >= 500 && attempt < retries) { log(`eDaptiva ${res.status} – retrying`); continue; }
      if (!res.ok) throw new Error(t("eDaptivaSaid", { s: `${res.status} ${res.statusText}` }));
      return await res.json();
    } catch (e) {
      if (e.name === "AbortError") {
        if (attempt < retries) { log(`No answer from eDaptiva within ${timeout / 1000} s – retrying`); continue; }
        const err = new Error(t("errTimeout", { s: Math.round(timeout / 1000) })); err.timeout = true; throw err;
      }
      throw e;
    } finally { clearTimeout(timer); }
  }
}

async function fetchEvents(ev) {
  ev.preventDefault();
  const from = $("from").value, to = $("to").value;
  const sevs = [4, 3].filter(s => $("sev-" + s).checked);
  if (!sevs.length) return msg($("fetch-msg"), "err", t("errSev"));
  if (from > to) return msg($("fetch-msg"), "err", t("errDates"));

  let area = null, uuids = null;
  if (state.site.areas) {
    if (!state.areas) return msg($("fetch-msg"), "err", t("errAreasNotLoaded"));
    area = state.areas.find(a => a.id === $("area").value);
    if (!area) return msg($("fetch-msg"), "err", t("errChooseArea"));
    uuids = area.controllerIds.map(id => state.controllers[id] && state.controllers[id].uuid).filter(Boolean);
    try { localStorage.setItem("edaptiva-last-area-" + state.site.id, area.id); } catch (e) {}
  }
  const btn = $("fetch-btn"); btn.disabled = true;
  const clientId = crypto.randomUUID ? crypto.randomUUID() : "00000000-0000-0000-0000-000000000000";
  const histFrom = addDays(from, -7 * HISTORY_WEEKS);

  // one chunk per history week + the period; a few chunks are fetched at the same time
  const chunks = [];
  for (let w = 0; w < HISTORY_WEEKS; w++) chunks.push([addDays(histFrom, 7 * w), addDays(histFrom, 7 * w + 6)]);
  chunks.push([from, to]);
  const all = []; let done = 0;
  const t0 = performance.now();
  const progress = () => msg($("fetch-msg"), "info", t("progress", { what: area ? `”${area.name}”` : t("data"), w: HISTORY_WEEKS, n: num(all.length), d: done, c: chunks.length }));
  async function fetchChunk([cFrom, cTo]) {
    for (let page = 0; page < MAX_PAGES; page++) {
      const rows = await apiGet(`EventArchive/${clientId}/all?filter=${encodeURIComponent(JSON.stringify(buildFilter(cFrom, cTo, sevs, page, uuids)))}&culture=en-US`);
      all.push(...rows); progress();
      if (rows.length < PAGE_SIZE) break;
    }
    done++; progress();
  }
  try {
    progress();
    const queue = [...chunks];
    await Promise.all(Array.from({ length: PARALLEL }, async () => { while (queue.length) await fetchChunk(queue.shift()); }));
    log(`Fetched ${all.length} fault events in ${((performance.now() - t0) / 1000).toFixed(1)} s` + (area ? ` (area ${area.name}, ${uuids.length} crossings)` : ""));

    /* ---- connectivity: connection lost/restored events + latest status per controller ---- */
    let comm = null;
    const scope = state.controllers ? (area ? area.controllerIds.map(id => state.controllers[id]).filter(Boolean) : Object.values(state.controllers)) : [];
    if (scope.length) {
      try {
        const tc = performance.now();
        msg($("fetch-msg"), "info", t("checkingComm", { n: scope.length }));
        const codeOr = { Type: "11", Left: { Type: "100", Value: COMM_LOST, Column: "MessageCode" }, Right: { Type: "100", Value: COMM_OK, Column: "MessageCode" } };
        const commEvents = [];
        await pool(chunks, PARALLEL, async ([cFrom, cTo]) => {
          for (let page = 0; page < MAX_PAGES; page++) {
            const cond = [codeOr, { Type: "105", Value: localIso(cFrom, "00:00:00"), Column: "EventStampOn" }, { Type: "103", Value: localIso(cTo, "23:59:59"), Column: "EventStampOn" }];
            if (uuids) cond.unshift(orTree(uuids));
            const rows = await apiGet(`EventArchive/${clientId}/all?filter=${encodeURIComponent(JSON.stringify({ Conditions: cond, Sorting: [{ Column: "EventStampOn", SortingOrder: 1 }], PageSize: PAGE_SIZE, Page: page }))}&culture=en-US`);
            commEvents.push(...rows);
            if (rows.length < PAGE_SIZE) break;
          }
        });
        log(`Connectivity: ${commEvents.length} lost/restored events fetched in ${((performance.now() - tc) / 1000).toFixed(1)} s`);
        // latest status per controller – limited in time so eDaptiva does not search the whole archive
        const since = { Type: "105", Value: localIso(dayKey(Date.now() - STATUS_LOOKBACK_DAYS * 864e5), "00:00:00"), Column: "EventStampOn" };
        const latestOf = async (uuid, cond) => (await apiGet(`EventArchive/${clientId}/all?filter=${encodeURIComponent(JSON.stringify({ Conditions: [{ Type: "100", Value: uuid, Column: "ControllerUUID" }, since, ...cond], Sorting: [{ Column: "EventStampOn", SortingOrder: 1 }], PageSize: 1, Page: 0 }))}&culture=en-US`, { timeout: 30000 }))[0];
        // controllers that already show up in the fetched data are evidently communicating
        const active = new Set([...all, ...commEvents].map(e => e.ControllerUUID));
        const latest = {}; let checked = 0, skipped = 0;
        const deadline = Date.now() + COMM_BUDGET_MS;
        await pool(scope, 4, async (c) => {
          if (Date.now() > deadline) { skipped++; latest[c.uuid] = {}; return; }
          try {
            const e = await latestOf(c.uuid, [codeOr]);
            if (e) latest[c.uuid] = { t: parseT(e.EventStampOn), lost: e.MessageCode === COMM_LOST };
            else if (active.has(c.uuid)) latest[c.uuid] = { none: true };
            else latest[c.uuid] = (await latestOf(c.uuid, [])) ? { none: true } : { never: true };
          } catch (err) {
            if (err.session) throw err;
            latest[c.uuid] = {}; skipped++; log(`Status for ${c.name}: ${err.message}`);
          }
          checked++;
          msg($("fetch-msg"), "info", t("checkingCommN", { d: checked, n: scope.length }));
        });
        comm = analyseComm(commEvents, latest, scope, from, to);
        comm.skipped = skipped;
        log(`Connectivity: status for ${scope.length - skipped}/${scope.length} controllers in ${((performance.now() - tc) / 1000).toFixed(1)} s total`);
        log(`Connectivity: ${commEvents.length} lost/restored events, ${comm.offlineNow.length} offline now, ${comm.never.length} without any events`);
      } catch (e) {
        if (e.session) throw e;
        log("Connectivity check failed:", e.message);
      }
    }
    msg($("fetch-msg"), "info", t("analysing", { n: num(all.length) }));
    await new Promise(r => setTimeout(r, 30));
    const crossings = area ? area.controllerIds.map(id => state.controllers[id].name)
                           : (state.controllers ? Object.values(state.controllers).map(c => c.name) : null);
    const report = analyse(all, from, to, sevs, crossings);
    report.area = area ? area.name : null;
    report.comm = comm;
    report.ctrlInfo = scope;
    report.site = state.site;
    report.created = Date.now();
    state.report = report;
    state.data = { site: state.site.id, area: report.area, from, to, historyFrom: histFrom, severities: sevs, fetched: new Date().toISOString(), events: all };
    showDoneMsg(report);
    renderReport(report);
  } catch (e) {
    if (e.session) { msg($("login-msg"), "err", t("sessionExpired")); logout(); return; }
    if (e instanceof TypeError) { log("Network/CORS error:", e.message); msg($("fetch-msg"), "err", t("errFetchCors")); }
    else { log("Error:", e.message); msg($("fetch-msg"), "err", e.message); }
  } finally { btn.disabled = false; }
}
function showDoneMsg(r) {
  msg($("fetch-msg"), "ok", t("done", { n: num(r.cur.length), p: `${fmtDate(r.from)}–${fmtDate(r.to)}`, h: num(r.hist.length), w: HISTORY_WEEKS }));
}

/* --------------------------- ANALYSIS (language neutral) --------------------------- */
const LAMP_CODES = new Set(["60005", "60006", "60007", "60010"]);
const FAMILY_BY_CODE = { "60014": "detector", "60003": "crit", "60001": "power", "60026": "timeshift", "60024": "cycle", "60037": "pt" };

/* Turn one raw eDaptiva event into what the report needs */
function normalise(e) {
  const code = String(e.MessageCode || "").split(":").pop();
  const p = e.MessageParameters || [];
  const msgTxt = e.Message || "";
  let fam = FAMILY_BY_CODE[code] || (LAMP_CODES.has(code) ? "lamp" : "other"), comp = "", color = "";
  if (fam === "detector") comp = String(p[0] ?? (msgTxt.match(/'([^']*)'/) || [])[1] ?? "");
  if (fam === "lamp") {
    comp = String(p[0] ?? (msgTxt.match(/Signal group:\s*([^,)]+)/) || [])[1] ?? "?");
    color = code === "60010" ? "red" : ((msgTxt.match(/Color:\s*(\w+)/i) || [])[1] || "").toLowerCase().replace("amber", "yellow");
  }
  if (fam === "other") comp = msgTxt || e.MessageCode || "?";
  const extra = (e.SecondaryEvents || []).map(s => {
    const m = s.Message || "";
    if (/Parasite voltage/i.test(m)) return { k: "parasite" };
    const ina = m.match(/inactivity time:\s*(\d+)/i);
    if (ina) return { k: "inactivity", v: ina[1] };
    return { k: "raw", v: m };
  });
  const tms = parseT(e.EventStampOn);
  const h = new Date(tms).getHours();
  const ctrl = (e.ControllerName || "").trim() || "?";
  return { id: e.Id, t: tms, ctrl, sev: e.Severity, code, fam, cat: catOf(fam), comp, color, extra, night: h >= 22 || h < 6, msg: msgTxt, rawCode: e.MessageCode,
           key: [ctrl, fam, comp].join("|") };
}

function analyse(rawEvents, from, to, sevs, crossings) {
  const seen = new Set(), evs = [];
  for (const e of rawEvents) { const k = e.Id || JSON.stringify(e); if (!seen.has(k)) { seen.add(k); evs.push(normalise(e)); } }
  evs.sort((a, b) => a.t - b.t);

  const pStart = dayStart(from), pEnd = dayStart(to, 1), hStart = dayStart(from, -7 * HISTORY_WEEKS);
  const periodDays = Math.round((pEnd - pStart) / 864e5);
  const cur = evs.filter(e => e.t >= pStart && e.t < pEnd);
  const hist = evs.filter(e => e.t >= hStart && e.t < pStart);
  const weekIdx = (tm) => Math.floor((pStart - tm) / (7 * 864e5)); // 0 = week just before the period

  /* incidents: events on one crossing within INCIDENT_GAP_S seconds of each other */
  const incidents = [], byCtrl = {};
  for (const e of cur) (byCtrl[e.ctrl] = byCtrl[e.ctrl] || []).push(e);
  for (const [ctrl, list] of Object.entries(byCtrl)) {
    let inc = null;
    for (const e of list) {
      if (inc && e.t - inc.end <= INCIDENT_GAP_S * 1000) { inc.events.push(e); inc.end = e.t; }
      else { inc = { ctrl, start: e.t, end: e.t, events: [e] }; incidents.push(inc); }
      e.inc = inc;
    }
  }
  for (const inc of incidents) {
    const parts = {}; for (const e of inc.events) parts[e.fam + "|" + e.comp] = { fam: e.fam, comp: e.comp };
    inc.parts = Object.values(parts).sort((a, b) => (a.fam === "crit") - (b.fam === "crit"));
    inc.sigKey = inc.parts.map(p => p.fam + "|" + p.comp).join("+");
    inc.detectors = inc.parts.filter(p => p.fam === "detector").map(p => p.comp);
    inc.hasCrit = inc.events.some(e => e.fam === "crit");
  }
  const patterns = {};
  for (const inc of incidents) { const k = inc.ctrl + "#" + inc.sigKey; (patterns[k] = patterns[k] || { ctrl: inc.ctrl, parts: inc.parts, list: [] }).list.push(inc); }
  const patternList = Object.values(patterns).sort((a, b) => b.list.length - a.list.length);

  /* faults (crossing + type + component) */
  const faults = {};
  const mk = (e) => faults[e.key] = faults[e.key] || { key: e.key, ctrl: e.ctrl, fam: e.fam, cat: e.cat, comp: e.comp,
    cur: [], weeks: new Array(HISTORY_WEEKS).fill(0), histTotal: 0, sev: 0, colors: {}, extras: {} };
  for (const e of cur) {
    const f = mk(e); f.cur.push(e); f.sev = Math.max(f.sev, e.sev);
    if (e.color) f.colors[e.color] = (f.colors[e.color] || 0) + 1;
    for (const x of e.extra) { const k = x.k === "raw" ? "raw:" + x.v : x.k; f.extras[k] = (f.extras[k] || 0) + 1; }
  }
  for (const e of hist) { const f = mk(e); const w = weekIdx(e.t); if (w >= 0 && w < HISTORY_WEEKS) f.weeks[w]++; f.histTotal++; }

  const faultList = Object.values(faults).map(f => {
    const n = f.cur.length, wp = f.weeks.filter(x => x > 0).length;
    const days = new Set(f.cur.map(e => dayKey(e.t))).size;
    const avg = f.histTotal / HISTORY_WEEKS, perWeek = n * 7 / periodDays;
    const status = [];
    if (n === 0) { if (wp >= 2) status.push("gone"); }
    else {
      if (n / periodDays > FLAP_PER_DAY) status.push("flap");
      if (wp >= PERSIST_WEEKS) status.push("persist"); else if (wp >= 1) status.push("recur"); else status.push("new");
      if (wp >= 1 && n >= 3 && perWeek > 2 * avg) status.push("rising");
      if (n >= 3 || days >= 2) status.push("repeat");
    }
    const nightShare = n ? f.cur.filter(e => e.night).length / n : 0;
    const withCrit = f.fam === "crit" ? 0 : f.cur.filter(e => e.inc && e.inc.hasCrit).length;
    return { ...f, n, wp, days, avg, status, nightShare, withCrit, last: n ? f.cur[n - 1].t : null };
  });
  const rank = (f) => (f.status.includes("flap") ? -1 : f.status.includes("persist") ? 0 : f.status.includes("rising") ? 1 : f.status.includes("recur") ? 2 : 3) * 1000 - f.n - (f.sev === 4 ? 500 : 0);
  const active = faultList.filter(f => f.n > 0).sort((a, b) => rank(a) - rank(b));
  const gone = faultList.filter(f => f.status.includes("gone")).sort((a, b) => b.wp - a.wp);

  /* per crossing */
  const ctrls = {};
  const blank = (name) => ({ name, n: 0, crit: 0, err: 0, hist: 0, lamp: 0, det: 0, sys: 0 });
  for (const name of crossings || []) ctrls[name] = ctrls[name] || blank(name);
  for (const e of cur) { const c = ctrls[e.ctrl] = ctrls[e.ctrl] || blank(e.ctrl); c.n++; c[e.cat]++; e.sev === 4 ? c.crit++ : c.err++; }
  for (const e of hist) { const c = ctrls[e.ctrl] = ctrls[e.ctrl] || blank(e.ctrl); c.hist++; }
  const incPerCtrl = {}; for (const i of incidents) incPerCtrl[i.ctrl] = (incPerCtrl[i.ctrl] || 0) + 1;
  const ctrlList = Object.values(ctrls).map(c => ({ ...c, avg: c.hist / HISTORY_WEEKS, incidents: incPerCtrl[c.name] || 0 }))
    .sort((a, b) => b.n - a.n || b.avg - a.avg);

  /* weekly series: history weeks + the period */
  const weekly = [];
  const byCat = (list) => { const o = { lamp: 0, det: 0, sys: 0 }; for (const e of list) o[e.cat]++; return o; };
  for (let w = HISTORY_WEEKS - 1; w >= 0; w--) { const l = hist.filter(e => weekIdx(e.t) === w); weekly.push({ start: pStart - (w + 1) * 7 * 864e5, count: l.length, cats: byCat(l), cur: false }); }
  weekly.push({ start: null, count: cur.length, cats: byCat(cur), cur: true });

  /* per category */
  const cats = {};
  for (const c of CATS) {
    const ce = cur.filter(e => e.cat === c);
    cats[c] = { n: ce.length, crit: ce.filter(e => e.sev === 4).length, avg: hist.filter(e => e.cat === c).length / HISTORY_WEEKS,
                ctrls: new Set(ce.map(e => e.ctrl)).size, top: active.filter(f => f.cat === c).slice().sort((a, b) => b.n - a.n).slice(0, 3),
                faults: active.filter(f => f.cat === c).length };
  }

  return { from, to, sevs, periodDays, cur, hist, incidents, patternList, active, gone, ctrlList, weekly, cats,
           crossingsTotal: crossings ? crossings.length : null,
           baselinePerWeek: hist.length / HISTORY_WEEKS, curPerWeek: cur.length * 7 / periodDays };
}

/* --------------------------- CONNECTIVITY ANALYSIS --------------------------- */
function analyseComm(rawEvents, latest, scope, from, to) {
  const pStart = dayStart(from), pEnd = dayStart(to, 1), now = Date.now(), pEndEff = Math.min(pEnd, now);
  const periodDays = Math.round((pEnd - pStart) / 864e5);
  const seen = new Set(), byUuid = {};
  for (const e of rawEvents) {
    if (seen.has(e.Id)) continue; seen.add(e.Id);
    (byUuid[e.ControllerUUID] = byUuid[e.ControllerUUID] || []).push({ t: parseT(e.EventStampOn), lost: e.MessageCode === COMM_LOST });
  }
  const rows = scope.map(c => {
    const evs = (byUuid[c.uuid] || []).sort((a, b) => a.t - b.t);
    const lat = latest[c.uuid] || {};
    // state at the start of the period
    const before = evs.filter(e => e.t < pStart);
    let offline = before.length ? before[before.length - 1].lost : (lat.t != null && lat.t < pStart ? lat.lost : false);
    let offStart = offline ? pStart : null, offMs = 0, drops = 0;
    for (const e of evs) {
      if (e.t < pStart || e.t >= pEnd) continue;
      if (e.lost) { drops++; if (!offline) { offline = true; offStart = e.t; } }
      else if (offline) { offMs += e.t - offStart; offline = false; offStart = null; }
    }
    if (offline && offStart != null) offMs += Math.max(0, pEndEff - offStart);
    const weeks = new Array(HISTORY_WEEKS).fill(0);
    for (const e of evs) if (e.lost && e.t < pStart) { const w = Math.floor((pStart - e.t) / (7 * 864e5)); if (w < HISTORY_WEEKS) weeks[w]++; }
    const len = Math.max(1, pEndEff - pStart);
    const status = lat.never ? "never" : lat.none ? "online" : lat.t == null ? "unknown" : lat.lost ? "offline" : "online";
    return { name: c.name || c.uuid.slice(0, 8), uuid: c.uuid, status, since: status === "offline" ? lat.t : null, drops, weeks,
             offMs, uptime: Math.max(0, 1 - offMs / len), unstable: drops / periodDays >= UNSTABLE_PER_DAY };
  });
  const order = (r) => r.status === "offline" ? 0 : r.status === "never" ? 1 : r.unstable ? 2 : r.drops ? 3 : r.weeks.some(Boolean) ? 4 : 5;
  rows.sort((a, b) => order(a) - order(b) || (a.since || 0) - (b.since || 0) || b.drops - a.drops || b.offMs - a.offMs);
  return { rows, total: rows.length, offlineNow: rows.filter(r => r.status === "offline"), never: rows.filter(r => r.status === "never"),
           unstable: rows.filter(r => r.unstable && r.status !== "offline"), periodDays };
}

/* --------------------------- TEXT FOR FAULTS --------------------------- */
const famLabel = (fam, comp) => fam === "other" ? comp : (L().fam[fam] || fam);
const compLabel = (fam, comp) => fam === "lamp" ? t("signalGroup", { g: comp }) : fam === "other" ? "" : comp;
const faultLabel = (f) => { const c = compLabel(f.fam, f.comp); return c ? `${famLabel(f.fam, f.comp)} – ${c}` : famLabel(f.fam, f.comp); };
const extraLabel = (k, v) => k.startsWith("raw:") ? k.slice(4) : k === "raw" ? v : (L().extra[k] || k) + (v ? " " + v : "");

/* automatic observations, most important first (built in the current language) */
function insights(r) {
  const out = [], F = L();
  if (r.comm) {
    const c = r.comm, now = Date.now();
    if (c.offlineNow.length) out.push({ lvl: "crit", html: F.insOffline(c.offlineNow.length,
      c.offlineNow.map(x => `${esc(x.name)} (${esc(F.since)} ${esc(fmtSince(x.since))}, ${esc(fmtDur(now - x.since))})`).join("; ")) });
    if (c.never.length) out.push({ lvl: "warn", html: F.insNever(c.never.length, c.never.map(x => esc(x.name)).join(", ")) });
    for (const x of c.unstable.slice(0, 3)) out.push({ lvl: "warn", html: F.insUnstable(esc(x.name), num(x.drops), esc(fmtDur(x.offMs))) });
  }
  const flap = r.active.filter(f => f.status.includes("flap"));
  if (flap.length) {
    const nFlap = flap.reduce((s, f) => s + f.n, 0), byC = {};
    for (const f of flap) (byC[f.ctrl] = byC[f.ctrl] || []).push(f);
    const list = Object.entries(byC).map(([c, l]) => `${esc(c)} (${l.map(f => `${esc(compLabel(f.fam, f.comp) || famLabel(f.fam, f.comp))} ${num(f.n)}×`).join(", ")})`).join("; ");
    out.push({ lvl: "crit", html: F.insFlap(flap.length, pct(nFlap / r.cur.length), list, FLAP_PER_DAY) });
  }
  for (const p of r.patternList.filter(p => p.list.length >= 3 && p.list.some(i => i.events.length >= 2) && p.list[0].detectors.length < 3).slice(0, 4)) {
    const days = [...new Set(p.list.map(i => fmtD(i.start)))].join(", ");
    const sig = p.parts.map(x => faultLabel(x)).join(" + ");
    const evs = p.list.flatMap(i => i.events);
    const extras = [...new Set(evs.flatMap(e => e.extra.map(x => extraLabel(x.k, x.k === "raw" ? x.v : ""))))];
    out.push({ lvl: evs.some(e => e.sev === 4) ? "crit" : "warn",
      html: F.insPattern(esc(p.ctrl), esc(sig), p.list.length, esc(days)) + (extras.length ? F.insExtra(esc(extras.join(", "))) : "") +
            (p.parts.length > 1 && p.parts.some(x => x.fam === "crit") ? F.insCritFollow : "") });
  }
  const bursts = {};
  for (const inc of r.incidents) if (inc.detectors.length >= 3) (bursts[inc.ctrl] = bursts[inc.ctrl] || []).push(inc);
  for (const [ctrl, list] of Object.entries(bursts).sort((a, b) => b[1].length - a[1].length).slice(0, 3)) {
    const big = list.reduce((m, i) => i.detectors.length > m.detectors.length ? i : m, list[0]);
    const dets = esc(big.detectors.slice(0, 8).join(", ") + (big.detectors.length > 8 ? " …" : ""));
    out.push({ lvl: "warn", html: `<b>${esc(ctrl)}:</b> ` + (list.length === 1
      ? F.insBurstOne(big.detectors.length, Math.round((big.end - big.start) / 1000), esc(fmtDT(big.start)), dets)
      : F.insBurstMany(list.length, big.detectors.length, esc(fmtDT(big.start)), dets)) + F.insBurstTail });
  }
  const persist = {};
  for (const f of r.active.filter(f => f.status.includes("persist"))) (persist[f.ctrl + "|" + f.fam] = persist[f.ctrl + "|" + f.fam] || []).push(f);
  for (const list of Object.values(persist).slice(0, 5)) {
    const f0 = list[0];
    if (list.length === 1) out.push({ lvl: "crit", html: F.insPersistOne(esc(f0.ctrl), esc(faultLabel(f0)), f0.wp, HISTORY_WEEKS, num(f0.n)) });
    else {
      const items = list.map(f => `${compLabel(f.fam, f.comp) || famLabel(f.fam, f.comp)} (${f.wp}/${HISTORY_WEEKS} ${F.weeksWord}, ${num(f.n)}× ${F.nowWord})`).join(", ");
      out.push({ lvl: "crit", html: F.insPersistMany(esc(f0.ctrl), list.length, esc(F.famPlural[f0.fam] || F.famPlural.other), esc(items), PERSIST_WEEKS, HISTORY_WEEKS) });
    }
  }
  for (const f of r.active.filter(f => f.status.includes("rising") && !f.status.includes("persist")).slice(0, 3))
    out.push({ lvl: "warn", html: F.insRising(esc(f.ctrl), esc(faultLabel(f)), num(f.n), num(f.avg, 1)) });
  for (const f of r.active.filter(f => f.n >= 3 && f.nightShare >= 0.75).slice(0, 3))
    out.push({ lvl: "", html: F.insNight(esc(f.ctrl), esc(faultLabel(f)), pct(f.nightShare)) });
  if (r.gone.length) out.push({ lvl: "", html: F.insGone(r.gone.length) });
  out.push({ lvl: "", html: r.hist.length ? F.insTotal(num(r.cur.length), num(r.curPerWeek), num(r.baselinePerWeek), HISTORY_WEEKS) : F.insNoHist(HISTORY_WEEKS) });
  return out;
}

/* --------------------------- RENDER --------------------------- */
function spark(weeks, now) {
  const vals = [...weeks].reverse().concat([now]);
  const mx = Math.max(1, ...vals);
  return `<span class="spark" title="${esc(t("sparkTitle", { v: vals.join(" / ") }))}">` +
    vals.map((v, i) => `<span class="${i === vals.length - 1 ? "cur" : v ? "" : "z"}" style="height:${v ? Math.max(3, v / mx * 20) : 2}px"></span>`).join("") + "</span>";
}
function weeklyChart(weekly) {
  const W = 760, H = 190, Lp = 46, B = 30, T = 16, n = weekly.length, ih = H - B - T, cw = (W - Lp) / n, bw = cw * 0.6;
  const mx = Math.max(5, ...weekly.map(w => w.count));
  const top = mx <= 10 ? Math.ceil(mx / 2) * 2 : Math.ceil(mx / 10) * 10;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t("chartAria"))}">`;
  for (const v of [0, top / 2, top]) { const y = T + ih - v / top * ih; s += `<line x1="${Lp}" x2="${W}" y1="${y}" y2="${y}" stroke="#e2e6ea"/><text x="${Lp - 6}" y="${y + 4}" font-size="11" fill="#79838d" text-anchor="end">${num(v)}</text>`; }
  weekly.forEach((w, i) => {
    const label = w.cur ? t("periodLbl") : fmtD(w.start);
    const x = Lp + i * cw + (cw - bw) / 2, cx = Lp + i * cw + cw / 2, h = w.count / top * ih, y = T + ih - h;
    let yy = T + ih;
    const tip = `${label}: ${num(w.count)} (${CATS.map(c => `${L().catShort[c]} ${num(w.cats[c])}`).join(", ")})`;
    for (const c of CATS) {
      const hc = w.cats[c] / top * ih; if (hc <= 0) continue; yy -= hc;
      s += `<rect x="${x}" y="${yy}" width="${bw}" height="${hc}" fill="${CAT_COLOR[c]}" fill-opacity="${w.cur ? 1 : 0.5}"><title>${esc(tip)}</title></rect>`;
    }
    if (h > 0 && w.cur) s += `<rect x="${x - 1.5}" y="${y - 1.5}" width="${bw + 3}" height="${h + 1.5}" fill="none" stroke="#1d2329" stroke-width="1.5"/>`;
    s += `<text x="${cx}" y="${y - 4}" font-size="11" fill="#4a545e" text-anchor="middle">${num(w.count)}</text>`;
    s += `<text x="${cx}" y="${H - B + 16}" font-size="11" fill="#4a545e" text-anchor="middle" ${w.cur ? 'font-weight="700"' : ""}>${esc(label)}</text>`;
  });
  return s + `<line x1="${Lp}" x2="${W}" y1="${T + ih}" y2="${T + ih}" stroke="#79838d"/></svg>`;
}
function delta(n, base) {
  if (!base) return n ? esc(t("noPrev")) : "";
  const p = (n - base) / base;
  const cls = p > 0.15 ? "up" : p < -0.15 ? "down" : "";
  return `<span class="${cls}">${p > 0 ? "▲" : p < 0 ? "▼" : ""} ${pct(Math.abs(p))}</span> ${esc(t("vsAvg", { b: base >= 100 ? num(base) : num(base, 1) }))}`;
}

/* controllers with no fault events – and (if known) not offline / never connected */
function noFaultCount(r) {
  const withFaults = new Set(r.ctrlList.filter(c => c.n).map(c => c.name));
  const bad = new Set(r.comm ? r.comm.rows.filter(x => x.status === "offline" || x.status === "never").map(x => x.name) : []);
  return r.ctrlList.filter(c => !withFaults.has(c.name) && !bad.has(c.name)).length;
}
function renderComm(r) {
  const c = r.comm, F = L();
  if (!c) return "";
  const shown = c.rows.filter(x => x.status !== "online" || x.drops || x.weeks.some(Boolean));
  const okCount = c.total - shown.length;
  let h = `<h3>${esc(t("hComm"))}</h3><p class="note">${esc(t("commNote"))}${c.skipped ? " " + esc(t("commSkipped", { n: c.skipped })) : ""}</p>`;
  if (!shown.length) return h + `<p>${esc(t("commAllOk", { n: c.total }))}</p>`;
  const now = Date.now();
  const st = (x) => x.status === "offline" ? `<span class="badge b-offline">${esc(F.cs.offline)}</span><br><span class="small">${esc(F.since)} ${esc(fmtSince(x.since))} (${esc(fmtDur(now - x.since))})</span>`
    : `<span class="badge b-${x.status}">${esc(F.cs[x.status])}</span>`;
  h += `<div class="tablewrap"><table><thead><tr><th>${esc(t("thCrossing"))}</th><th>${esc(t("thStatusNow"))}</th><th class="n">${esc(t("thDrops"))}</th><th>${esc(t("thWeekly"))}</th><th class="n">${esc(t("thOffTime"))}</th><th class="n">${esc(t("thUptime"))}</th></tr></thead><tbody>` +
    shown.map(x => `<tr><td>${esc(x.name)}</td><td>${st(x)}${x.unstable ? ` <span class="badge b-unstable">${esc(F.cs.unstable)}</span>` : ""}</td>
      <td class="n"><b>${num(x.drops)}</b></td><td>${spark(x.weeks, x.drops)}</td>
      <td class="n">${x.status === "never" ? "–" : x.offMs ? esc(fmtDur(x.offMs)) : "0"}</td><td class="n">${x.status === "never" ? "–" : esc(pct1(x.uptime))}</td></tr>`).join("") +
    `</tbody></table></div>`;
  if (okCount) h += `<p class="small">${esc(t("commOthersOk", { n: okCount }))}</p>`;
  return h;
}
const pct1 = (x) => { const v = x * 100, s = v >= 99.95 || v === 0 ? num(v) : num(v, 1); return LANG === "da" ? `${s} %` : `${s}%`; };

/* filter buttons above a table: rows with data-cat are shown/hidden (self-contained – also used in the e-mailed file) */
function bindCatFilters(root) {
  for (const bar of root.querySelectorAll(".catfilter")) {
    const table = root.querySelector("#" + bar.dataset.for); if (!table) continue;
    for (const b of bar.querySelectorAll("button")) b.addEventListener("click", () => {
      for (const x of bar.querySelectorAll("button")) x.classList.toggle("on", x === b);
      for (const tr of table.querySelectorAll("tbody tr")) tr.style.display = b.dataset.cat === "all" || tr.dataset.cat === b.dataset.cat ? "" : "none";
    });
  }
}

function renderReport(r) {
  const F = L(), site = r.site, W = HISTORY_WEEKS;
  const badge = (s) => `<span class="badge b-${s}">${esc(F.st[s])}</span>`;
  const sevTxt = r.sevs.map(s => SEVERITY[s]).join(" + ");
  const headName = r.area || siteName(site);
  const sub = [r.area ? (site.short || siteName(site)) : null, t("subPeriod", { a: fmtDate(r.from), b: fmtDate(r.to) }), t("subSev", { s: sevTxt }),
               t("subCompared", { w: W }), t("subMade", { d: fmtFull(r.created) })].filter(Boolean);
  let h = `<div class="rep-head"><h2>${esc(t("repTitle", { name: headName }))}</h2><div class="sub">${esc(sub.join(" · "))}</div></div>`;

  const crit = r.cur.filter(e => e.sev === 4).length;

  const withFaults = r.ctrlList.filter(c => c.n).length;
  h += `<div class="tiles">

    ${r.crossingsTotal ? `<div class="tile"><div class="k">${esc(t("tNoFault"))}</div><div class="v">${esc(t("tNoFaultV", { a: noFaultCount(r), b: r.crossingsTotal }))}</div><div class="d">${esc(t("inPeriod"))}</div></div>` : ""}
    ${r.comm ? `<div class="tile"><div class="k">${esc(t("tOffline"))}</div><div class="v${r.comm.offlineNow.length ? " up" : ""}">${esc(t("tNoFaultV", { a: r.comm.offlineNow.length, b: r.comm.total }))}</div><div class="d">${esc(t("tOfflineSub", { n: r.comm.never.length }))}</div></div>` : ""}
    <div class="tile"><div class="k">${esc(t("tFaults"))}</div><div class="v">${num(r.active.length)}</div><div class="d">${esc(t("tFaultsSub", { c: withFaults, i: num(r.incidents.length) }))}</div></div>
    <div class="tile"><div class="k">${esc(t("tRepeat"))}</div><div class="v">${num(repeating)}</div><div class="d">${esc(t("tRepeatSub"))}</div></div>
  </div>`;

  h += `<h3>${esc(t("hInsights"))}</h3><ul class="insights">${insights(r).map(i => `<li class="${i.lvl}">${i.html}</li>`).join("")}</ul>`;
  h += renderTypes(r);
  h += renderMapSection(r);
  h += renderComm(r);

  const legend = [["flap", t("defFlap", { n: FLAP_PER_DAY })], ["persist", t("defPersist", { p: PERSIST_WEEKS, w: W })], ["recur", t("defRecur", { p1: PERSIST_WEEKS - 1, w: W })],
                  ["new", t("defNew", { w: W })], ["repeat", t("defRepeat")]].map(([k, d]) => `<b>${esc(F.st[k])}</b> = ${esc(d)}`).join(" · ");
  const nByCat = (c) => r.active.filter(f => f.cat === c).length;
  h += `<h3>${esc(t("hFaults"))}</h3><p class="note">${esc(t("faultsNote", { w: W }))} ${legend}.</p>
    <div class="catfilter noprint" data-for="faults-table"><button type="button" class="on" data-cat="all">${esc(t("filterAll"))} <b>${r.active.length}</b></button>${
      CATS.map(c => `<button type="button" data-cat="${c}">${catChip(c)} <b>${nByCat(c)}</b></button>`).join("")}</div>
    <div class="tablewrap"><table id="faults-table"><thead><tr><th>${esc(t("thCrossing"))}</th><th>${esc(t("thFault"))}</th><th class="n">${esc(t("thCount"))}</th><th class="n">${esc(t("thDays"))}</th><th>${esc(t("thWeekly"))}</th><th class="n">${esc(t("thWeeksBefore"))}</th><th>${esc(t("thStatus"))}</th><th>${esc(t("thExtra"))}</th><th>${esc(t("thLast"))}</th></tr></thead><tbody>` +

        colors ? `<br><span class="small">${esc(colors)}</span>` : ""}${f.withCrit ? `<br><span class="small">${esc(t("withCrit", { n: f.withCrit }))}</span>` : ""}</td>
      <td class="n"><b>${num(f.n)}</b></td><td class="n">${f.days}</td><td>${spark(f.weeks, f.n)}</td><td class="n">${f.wp}/${W}</td>

      multi.map(p => `<tr><td>${esc(p.ctrl)}</td><td>${esc(p.parts.map(x => faultLabel(x)).join(" + "))}</td><td class="n"><b>${p.list.length}</b></td>
        <td class="small">${esc(p.list.slice(0, 12).map(i => fmtDT(i.start)).join(" · "))}${p.list.length > 12 ? " …" : ""}</td></tr>`).join("") + `</tbody></table></div>`;
  }

  h += `<h3>${esc(t("hWeekly"))}</h3>${weeklyChart(r.weekly)}<div class="tlc-legend">${CATS.map(c => catChip(c, L().cat[c])).join("")}<span class="small">${esc(t("weeklyLegend"))}</span></div>
    <p class="small">${esc(t("weeklyNote", { w: W }) + (r.periodDays !== 7 ? t("periodDaysNote", { n: r.periodDays }) : ""))}</p>`;

  if (r.gone.length) {
    h += `<h3>${esc(t("hGone"))}</h3><p class="note">${esc(t("goneNote", { w: W }))}</p>
      <div class="tablewrap"><table><thead><tr><th>${esc(t("thCrossing"))}</th><th>${esc(t("thFault"))}</th><th>${esc(t("thWeekly"))}</th><th class="n">${esc(t("thWeeksBefore"))}</th></tr></thead><tbody>` +
      r.gone.map(f => `<tr><td>${esc(f.ctrl)}</td><td>${esc(faultLabel(f))}</td><td>${spark(f.weeks, 0)}</td><td class="n">${f.wp}/${W}</td></tr>`).join("") + `</tbody></table></div>`;
  }

  const shown = r.cur.length > EVENT_LIST_MAX ? r.cur.slice(-EVENT_LIST_MAX) : r.cur;
  const summary = r.cur.length > EVENT_LIST_MAX ? t("showLatest", { m: EVENT_LIST_MAX, n: num(r.cur.length) }) : t("showN", { n: r.cur.length });
  h += `<h3>${esc(t("hAll"))}</h3><details><summary class="noprint">${esc(summary)}</summary><div class="tablewrap"><table>
    <thead><tr><th>${esc(t("thTime"))}</th><th>${esc(t("thCrossing"))}</th><th>${esc(t("thSeverity"))}</th><th>${esc(t("thMessage"))}</th><th>${esc(t("thExtra"))}</th></tr></thead><tbody>` +
    [...shown].reverse().map(e => `<tr><td>${esc(fmtFull(e.t))}</td><td>${esc(e.ctrl)}</td><td><span class="sev sev-${e.sev}">${esc(SEVERITY[e.sev] || e.sev)}</span></td>
      <td>${esc(e.msg)} <span class="small">${esc(e.rawCode)}</span></td><td class="small">${esc(e.extra.map(x => extraLabel(x.k, x.v)).join(", "))}</td></tr>`).join("") + `</tbody></table></div></details>`;

  $("report").innerHTML = h;
  $("result").classList.remove("hidden");
  bindCatFilters(document.getElementById("report"));
  activateMap(r);
}

/* ---- e-mail: save the report as a self-contained HTML file and open the mail program ---- */
function plain(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.replace(/\s+/g, " ").trim(); }
function saveFile(name, content, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function openMail(url) { location.href = url; }
/* the report's HTML without the live map (the file builds its own map when opened) */

  for (const el of clone.querySelectorAll("tr.hl")) el.classList.remove("hl");
  return clone.innerHTML;
}

    `• ${t("tEvents")}: ${num(r.cur.length)} (${plain(delta(r.curPerWeek, r.baselinePerWeek))})`,
    `• ${t("tCrit")}: ${num(crit)}`,
    `• ${t("hTypes")}: ${CATS.map(c => `${L().cat[c]} ${num(r.cats[c].n)}`).join(" · ")}`,
    r.crossingsTotal ? `• ${t("tNoFault")}: ${t("tNoFaultV", { a: noFaultCount(r), b: r.crossingsTotal })}` : null,
    `• ${t("tFaults")}: ${num(r.active.length)}`,
  ].filter(Boolean);
  const obs = insights(r).slice(0, 4).map(i => { const s = plain(i.html); return "• " + (s.length > 340 ? s.slice(0, 337) + "…" : s); });
  const body = [t("mailIntro", { name, p: period }), "", t("mailFigures"), ...figures, "", t("mailObs"), ...obs, "", t("mailBye")].join("\n");
  const subject = t("mailSubject", { name, p: period });
  msg($("fetch-msg"), "ok", t("emailSaved", { f: fileName }));
  setTimeout(() => openMail(`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`), 400);
  log("Report saved as", fileName, "and mail program opened");
}

function downloadJson() {
  if (!state.data) return;
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `edaptiva_${state.data.site}${state.data.area ? "_" + state.data.area.replace(/\W+/g, "-") : ""}_${state.data.from}_${state.data.to}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* --------------------------- START --------------------------- */
(function init() {
  const sel = $("site");
  let last = null; try { last = localStorage.getItem("edaptiva-last-site"); } catch (e) {}
  for (const s of SITES) { const o = document.createElement("option"); o.value = s.id; o.textContent = siteName(s); if (s.id === last) o.selected = true; sel.appendChild(o); }

  const today = new Date();
  $("to").value = dayKey(today.getTime() - 864e5); $("from").value = dayKey(today.getTime() - 7 * 864e5);

  $("login-form").addEventListener("submit", login);
  $("username").addEventListener("change", normaliseUsernameField);
  $("username").addEventListener("input", () => { if ($("username").value.includes(CRED_SEP)) normaliseUsernameField(); });
  $("query-form").addEventListener("submit", fetchEvents);
  $("logout-btn").addEventListener("click", logout);
  $("dl-json").addEventListener("click", downloadJson);
  $("print-btn").addEventListener("click", () => window.print());
  $("mail-btn").addEventListener("click", emailReport);
  for (const b of document.querySelectorAll(".lang button")) b.addEventListener("click", () => setLang(b.dataset.lang));
  if (credSupported()) { $("saved-btn").classList.remove("hidden"); $("saved-btn").addEventListener("click", useSavedLogin); }

  setLang(LANG);
  try {  // stay logged in when the page is reloaded (same tab, key is valid for ~1 hour)
    const s = JSON.parse(sessionStorage.getItem("edaptiva-session") || "null");
    const site = s && SITES.find(x => x.id === s.site);
    if (site) { Object.assign(state, { site, token: s.token, deviceId: s.deviceId, user: s.user }); showApp(); }
  } catch (e) {}
  $("version").textContent = "Version " + APP_VERSION;
  log("Page ready. Version", APP_VERSION, "· Instances:", SITES.map(s => s.id).join(", "));
})();
</script>
