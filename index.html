<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eDaptiva fejlrapport</title>
<style>
:root{--ink:#1d2329;--ink2:#4a545e;--muted:#79838d;--line:#e2e6ea;--bg:#f4f6f8;--card:#fff;--accent:#00a37a;--accent-ink:#fff;
--err:#b42318;--err-bg:#fdecea;--ok:#1e7a46;--ok-bg:#e5f4ea;--crit:#b42318;--crit-bg:#fdecea;--warn:#8a6100;--warn-bg:#fdf6d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
header.top h1{margin:0;font-size:22px}
header.top .who{color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:16px}
.login{max-width:400px;margin:40px auto}
.login h2{margin:0 0 4px;font-size:20px}
.login p.sub{margin:0 0 18px;color:var(--ink2);font-size:14px}
label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
input[type=text],input[type=password],input[type=date],select{width:100%;padding:9px 11px;border:1px solid #c9d0d6;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
button{font:inherit;border:0;border-radius:7px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.secondary{background:#e9edf0;color:var(--ink)}
button:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1 1 170px}
.checks{display:flex;gap:18px;padding:8px 0}
.checks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:15px}
.msg{padding:10px 12px;border-radius:7px;font-size:14px;margin-top:14px;display:none}
.msg.err{display:block;background:var(--err-bg);color:var(--err)}
.msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}
.msg.info{display:block;background:#eef3f8;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:4px 0 18px}
.tile{background:var(--bg);border-radius:8px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--ink2)}.tile .v{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--ink2);font-weight:600;border-bottom:2px solid var(--line);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right}
.sev{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.sev-4{color:var(--crit);background:var(--crit-bg)}.sev-3{color:var(--warn);background:var(--warn-bg)}
.small{font-size:12px;color:var(--muted)}
h3{margin:22px 0 8px;font-size:16px}
details.diag{margin-top:28px;font-size:13px;color:var(--ink2)}
details.diag pre{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;max-height:300px;overflow:auto}
.hidden{display:none!important}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:8px}
.rep-head{border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.rep-head h2{margin:0;font-size:22px}.rep-head .sub{color:var(--ink2);font-size:14px}
.report h3{font-size:17px;margin:28px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.tile .d{font-size:12px;color:var(--muted)}
.up{color:var(--crit)}.down{color:var(--ok)}
ul.insights{margin:0;padding:0;list-style:none}
ul.insights li{padding:10px 12px 10px 14px;border-left:4px solid var(--ink2);background:var(--bg);border-radius:0 6px 6px 0;margin-bottom:8px}
ul.insights li.crit{border-left-color:var(--crit)}ul.insights li.warn{border-left-color:#c98a00}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 4px 1px 0}
.b-vedvarende{color:var(--crit);background:var(--crit-bg)}.b-blinker{color:#fff;background:var(--crit)}.b-stigende{color:#b54708;background:#fef0e1}
.b-tilbagevendende{color:var(--warn);background:var(--warn-bg)}.b-ny{color:#175cd3;background:#eaf1fd}
.b-gentaget{color:var(--ink);background:#e9edf0}.b-udbedret{color:var(--ok);background:var(--ok-bg)}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:20px;vertical-align:middle}
.spark span{width:7px;background:#a9c2df;border-radius:1px 1px 0 0;min-height:1px}
.spark span.z{background:#e2e6ea}.spark span.cur{background:#1f4f86}
.note{font-size:13px;color:var(--ink2);background:var(--bg);padding:8px 12px;border-radius:6px;margin:8px 0}
code{font-size:13px}
@media print{body{background:#fff;font-size:12px}.wrap{padding:0;max-width:none}.noprint,#view-app>header,#view-app>.card:first-of-type,details.diag{display:none!important}
 .card{border:0;padding:0;margin:0}tr,li,.tile{break-inside:avoid}h3{break-after:avoid}}
@media (max-width:600px){.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===================== LOGIN ===================== -->
  <section id="view-login" class="card login">
    <h2>eDaptiva fejlrapport</h2>
    <p class="sub">Log ind med dit eDaptiva-login.</p>
    <form id="login-form" autocomplete="on">
      <label for="site">Kommune</label>
      <select id="site" name="site"></select>
      <label for="username">Brugernavn</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Adgangskode</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="twofa-box" class="hidden">
        <label for="twofa">Engangskode (2-faktor)</label>
        <input id="twofa" name="twofa" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      </div>
      <div style="margin-top:18px"><button id="login-btn" type="submit">Log ind</button></div>
      <div id="login-msg" class="msg"></div>
    </form>
  </section>

  <!-- ===================== APP ===================== -->
  <section id="view-app" class="hidden">
    <header class="top">
      <h1>eDaptiva fejlrapport</h1>
      <div class="who"><span id="who"></span> &nbsp;<button class="secondary" id="logout-btn" type="button">Log ud</button></div>
    </header>

    <div class="card">
      <form id="query-form">
        <div class="row">
          <div id="area-box" class="hidden"><label for="area">Område</label><select id="area"></select></div>
          <div><label for="from">Fra dato</label><input id="from" type="date" required></div>
          <div><label for="to">Til dato (inkl.)</label><input id="to" type="date" required></div>
          <div>
            <label>Alvorlighed</label>
            <div class="checks">
              <label><input type="checkbox" id="sev-4" checked> Critical error</label>
              <label><input type="checkbox" id="sev-3" checked> Error</label>
            </div>
          </div>
          <div style="flex:0 0 auto"><button id="fetch-btn" type="submit">Hent hændelser</button></div>
        </div>
        <div id="fetch-msg" class="msg"></div>
      </form>
    </div>

    <div id="result" class="card report hidden">
      <div class="noprint actions">
        <button type="button" id="print-btn">Udskriv / gem som PDF</button>
        <button class="secondary" id="dl-json" type="button">Download data (JSON)</button>
      </div>
      <div id="report"></div>
    </div>
  </section>

  <details class="diag"><summary>Teknisk log (til fejlsøgning)</summary><pre id="diag"></pre></details>
</div>

<script>
"use strict";
/* ---------------------------------------------------------------
   Municipalities. The API id is the GUID segment in eDaptiva's API URL.
   Add new municipalities here.
---------------------------------------------------------------- */
const SITES = [
  { id: "favrskov", name: "Favrskov Kommune", host: "https://favrskov.edaptiva.cloud", apiId: "72f9e7db-9d7f-4a16-a2cb-3a6e73bbdb71" },
  { id: "verdo", name: "Verdo – generel (vælg område)", host: "https://verdo.edaptiva.cloud", apiId: "72f9e7db-9d7f-4a16-a2cb-3a6e73bbdb71", areas: true },
];
const SEVERITY = { 3: "Error", 4: "Critical error" };
const PAGE_SIZE = 1000, MAX_PAGES = 300;
const PARALLEL = 3;             // simultaneous requests to eDaptiva
const PERSIST_WEEKS = 3;        // "vedvarende" = seen in at least this many of the history weeks
const FLAP_PER_DAY = 10;        // a fault with more events per day than this is "blinkende" (flapping)
const EVENT_LIST_MAX = 500;     // max rows in the "all events" list
const HISTORY_WEEKS = 4;        // weeks before the period used for trends
const INCIDENT_GAP_S = 10;      // events on the same crossing within this many seconds = one incident

/* test override: ?host=http://localhost:8766&apiId=test (used only for local testing) */
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("host")) SITES.unshift({ id: "test", name: "TEST (" + q.get("host") + ")", host: q.get("host"), apiId: q.get("apiId") || "test", areas: q.get("areas") === "1" });
})();

const $ = (id) => document.getElementById(id);
const state = { site: null, token: null, deviceId: null, user: null, data: null, controllers: null, areas: null };

function log(...a) {
  const line = new Date().toLocaleTimeString("da-DK") + "  " + a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" ");
  $("diag").textContent += line + "\n";
  console.log(...a);
}
function msg(el, kind, text) { el.className = "msg " + (kind || ""); el.textContent = text || ""; }
function apiBase(site) { return `${site.host}/${site.apiId}/api/v2.0/`; }

/* A per-browser device id (not secret). eDaptiva ties the login key to it. */
function deviceId() {
  let d = null;
  try { d = localStorage.getItem("edaptiva-device-id"); } catch (e) {}
  if (!d) {
    d = "rapport-" + (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
    try { localStorage.setItem("edaptiva-device-id", d); } catch (e) {}
  }
  return d;
}

/* --------------------------- LOGIN --------------------------- */
let pending2fa = null;

async function login(ev) {
  ev.preventDefault();
  const site = SITES.find(s => s.id === $("site").value);
  const user = $("username").value.trim(), pw = $("password").value;
  const btn = $("login-btn"); btn.disabled = true;
  msg($("login-msg"), "info", "Logger ind…");
  try {
    let res;
    if (pending2fa) {
      log("POST Account/2FA");
      res = await fetch(apiBase(site) + "Account/2FA", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Csrf-Token": pending2fa.csrf, "X-2fa-Token": pending2fa.token, "Google-auth": $("twofa").value.trim() },
      });
    } else {
      state.deviceId = deviceId();
      log("POST Account/Login", { site: site.id, host: site.host });
      res = await fetch(apiBase(site) + "Account/Login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ LoginName: user, Password: pw, DeviceId: state.deviceId }),
      });
    }
    log("Svar", res.status, res.statusText);
    if (res.status === 401) {
      const timeProblem = !!res.headers.get("Www-Authenticate");
      throw new Error(pending2fa ? "Forkert engangskode." :
        timeProblem ? "Login afvist – eDaptiva melder et tidsproblem (tjek at PC'ens ur er korrekt)." :
        "Forkert brugernavn eller adgangskode.");
    }
    if (!res.ok) throw new Error(`Uventet svar fra eDaptiva: ${res.status} ${res.statusText}`);

    const twofa = res.headers.get("X-2fa-Token");
    const text = await res.text();
    let body = null; try { body = text ? JSON.parse(text) : null; } catch (e) {}
    const token = body && body.TokenAccess && body.TokenAccess.Value;

    if (!token && twofa) {
      pending2fa = { token: twofa, csrf: res.headers.get("X-Csrf-Token") };
      $("twofa-box").classList.remove("hidden"); $("twofa").focus();
      msg($("login-msg"), "info", "Indtast engangskoden fra din 2-faktor-app.");
      log("2FA krævet");
      return;
    }
    if (!token) {
      log("Login-svar uden token. Felter:", body ? Object.keys(body) : "(tomt)");
      throw new Error(body ? "Login gav intet adgangs-token (måske kræves 2-faktor, som siden endnu ikke kan læse)." : "Tomt svar fra eDaptiva.");
    }

    state.site = site; state.token = token; state.user = user;
    try { sessionStorage.setItem("edaptiva-session", JSON.stringify({ site: site.id, token, deviceId: state.deviceId, user })); } catch (e) {}
    try { localStorage.setItem("edaptiva-last-site", site.id); } catch (e) {}
    pending2fa = null;
    log("Logget ind som", user);
    showApp();
  } catch (e) {
    if (e instanceof TypeError) {
      log("Netværks-/CORS-fejl:", e.message);
      msg($("login-msg"), "err", "Kunne ikke kontakte eDaptiva fra denne side. Enten er der ingen forbindelse, eller eDaptiva blokerer adgang fra denne adresse (CORS). Se teknisk log nederst.");
    } else {
      log("Fejl:", e.message);
      msg($("login-msg"), "err", e.message);
    }
  } finally { btn.disabled = false; }
}

function logout() {
  state.token = null; state.data = null;
  try { sessionStorage.removeItem("edaptiva-session"); } catch (e) {}
  $("password").value = ""; $("twofa").value = ""; $("twofa-box").classList.add("hidden"); pending2fa = null;
  $("result").classList.add("hidden");
  $("view-app").classList.add("hidden"); $("view-login").classList.remove("hidden");
  msg($("login-msg"), "", "");
}

function showApp() {
  $("view-login").classList.add("hidden"); $("view-app").classList.remove("hidden");
  $("who").textContent = `${state.user} · ${state.site.name}`;
  $("password").value = "";
  loadControllers();
}

/* Crossings (and areas on the general instance). Only id/uuid/name are kept –
   the controller list from eDaptiva also holds connection settings, which we drop. */
async function loadControllers() {
  const cid = crypto.randomUUID();
  state.controllers = null; state.areas = null;
  $("area-box").classList.toggle("hidden", !state.site.areas);
  try {
    const list = await apiGet(`Controllers/${cid}/all?culture=en-US`);
    state.controllers = {};
    for (const c of list) if (!c.Archived) state.controllers[c.Id] = { uuid: c.UUID, name: (c.ControllerName || "").trim() };
    log("Kryds hentet:", Object.keys(state.controllers).length);
  } catch (e) {
    if (e.session) { msg($("login-msg"), "err", "Din session er udløbet – log ind igen."); return logout(); }
    log("Kunne ikke hente krydsliste:", e.message);
  }
  if (!state.site.areas) return;
  const sel = $("area");
  sel.innerHTML = "<option>Henter områder…</option>"; sel.disabled = true;
  try {
    const areas = await apiGet(`Area/${cid}?deep=true&culture=en-US`);
    state.areas = areas.map(a => ({ id: a.Id, name: (a.Name || "").trim(),
        controllerIds: (a.ControllerIds || []).filter(id => !state.controllers || state.controllers[id]) }))
      .filter(a => a.controllerIds.length).sort((a, b) => a.name.localeCompare(b.name, "da"));
    let last = null; try { last = localStorage.getItem("edaptiva-last-area-" + state.site.id); } catch (e) {}
    sel.innerHTML = state.areas.map(a => `<option value="${esc(a.id)}"${a.id === last ? " selected" : ""}>${esc(a.name)} (${a.controllerIds.length} kryds)</option>`).join("");
    sel.disabled = false;
    log("Områder:", state.areas.map(a => a.name).join(", "));
  } catch (e) {
    sel.innerHTML = "<option>Kunne ikke hente områder</option>";
    if (e.session) { msg($("login-msg"), "err", "Din session er udløbet – log ind igen."); return logout(); }
    log("Kunne ikke hente områder:", e.message);
  }
}

/* --------------------------- FETCH --------------------------- */
/* "2026-11-19" + "00:00:00" -> "2026-11-19T00:00:00+01:00" in the PC's local time (handles summer time) */
function localIso(dateStr, timeStr) {
  const d = new Date(`${dateStr}T${timeStr}`);
  const off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-", a = Math.abs(off);
  return `${dateStr}T${timeStr}${sign}${String(Math.floor(a / 60)).padStart(2, "0")}:${String(a % 60).padStart(2, "0")}`;
}

/* OR-tree over the crossings' UUIDs (eDaptiva only combines two conditions per OR) */
function orTree(uuids) {
  if (uuids.length === 1) return { Type: "100", Value: uuids[0], Column: "ControllerUUID" };
  const m = Math.ceil(uuids.length / 2);
  return { Type: "11", Left: orTree(uuids.slice(0, m)), Right: orTree(uuids.slice(m)) };
}

function buildFilter(from, to, sevs, page, uuids) {
  const cond = [];
  if (uuids && uuids.length) cond.push(orTree(uuids));
  if (sevs.length === 1) cond.push({ Type: "100", Value: String(sevs[0]), Column: "Severity" });
  else if (sevs.length === 2) cond.push({ Type: "11", Left: { Type: "100", Value: String(sevs[0]), Column: "Severity" }, Right: { Type: "100", Value: String(sevs[1]), Column: "Severity" } });
  cond.push({ Type: "105", Value: localIso(from, "00:00:00"), Column: "EventStampOn" });
  cond.push({ Type: "103", Value: localIso(to, "23:59:59"), Column: "EventStampOn" });
  return { Conditions: cond, Sorting: [{ Column: "EventStampOn", SortingOrder: 1 }], PageSize: PAGE_SIZE, Page: page };
}

async function apiGet(path) {
  const res = await fetch(apiBase(state.site) + path, {
    headers: { "Authorization": "Bearer " + state.token, "X-Device-Id": state.deviceId },
  });
  if (res.status === 401) { const e = new Error("SESSION"); e.session = true; throw e; }
  if (!res.ok) throw new Error(`eDaptiva svarede ${res.status} ${res.statusText}`);
  return res.json();
}

async function fetchEvents(ev) {
  ev.preventDefault();
  const from = $("from").value, to = $("to").value;
  const sevs = [4, 3].filter(s => $("sev-" + s).checked);
  if (!sevs.length) return msg($("fetch-msg"), "err", "Vælg mindst én alvorlighed.");
  if (from > to) return msg($("fetch-msg"), "err", "Fra-dato skal være før til-dato.");

  // which crossings: the chosen area (general instance) or all
  let area = null, uuids = null;
  if (state.site.areas) {
    if (!state.areas) return msg($("fetch-msg"), "err", "Områderne er ikke hentet endnu – vent et øjeblik eller log ind igen.");
    area = state.areas.find(a => a.id === $("area").value);
    if (!area) return msg($("fetch-msg"), "err", "Vælg et område.");
    uuids = area.controllerIds.map(id => state.controllers[id] && state.controllers[id].uuid).filter(Boolean);
    try { localStorage.setItem("edaptiva-last-area-" + state.site.id, area.id); } catch (e) {}
  }
  const btn = $("fetch-btn"); btn.disabled = true;
  const clientId = crypto.randomUUID ? crypto.randomUUID() : "00000000-0000-0000-0000-000000000000";
  const histFrom = addDays(from, -7 * HISTORY_WEEKS);   // also fetch previous weeks for trend comparison

  // split into chunks (each history week + the period) and fetch a few at a time
  const chunks = [];
  for (let w = 0; w < HISTORY_WEEKS; w++) chunks.push([addDays(histFrom, 7 * w), addDays(histFrom, 7 * w + 6)]);
  chunks.push([from, to]);
  const all = []; let done = 0;
  const t0 = performance.now();
  const progress = () => msg($("fetch-msg"), "info",
    `Henter ${area ? "\u201d" + area.name + "\u201d" : "data"}: periode + ${HISTORY_WEEKS} ugers historik… ${all.length.toLocaleString("da-DK")} hændelser (${done}/${chunks.length} dele færdige)`);
  async function fetchChunk([cFrom, cTo]) {
    for (let page = 0; page < MAX_PAGES; page++) {
      const f = buildFilter(cFrom, cTo, sevs, page, uuids);
      const rows = await apiGet(`EventArchive/${clientId}/all?filter=${encodeURIComponent(JSON.stringify(f))}&culture=en-US`);
      all.push(...rows); progress();
      if (rows.length < PAGE_SIZE) break;
    }
    done++; progress();
  }
  try {
    progress();
    const queue = [...chunks];
    await Promise.all(Array.from({ length: PARALLEL }, async () => { while (queue.length) await fetchChunk(queue.shift()); }));
    log(`Hentet ${all.length} hændelser på ${((performance.now() - t0) / 1000).toFixed(1)} s` + (area ? ` (område ${area.name}, ${uuids.length} kryds)` : ""));
    msg($("fetch-msg"), "info", `Analyserer ${all.length.toLocaleString("da-DK")} hændelser…`);
    await new Promise(r => setTimeout(r, 30));   // let the message show
    const crossings = area ? area.controllerIds.map(id => state.controllers[id].name)
                           : (state.controllers ? Object.values(state.controllers).map(c => c.name) : null);
    const report = analyse(all, from, to, sevs, crossings);
    report.area = area ? area.name : null;
    state.data = { site: state.site.id, area: report.area, from, to, historyFrom: histFrom, severities: sevs, fetched: new Date().toISOString(), events: all };
    msg($("fetch-msg"), "ok", `Rapport lavet: ${report.cur.length.toLocaleString("da-DK")} hændelser i perioden ${fmtDate(from)}–${fmtDate(to)} (+ ${report.hist.length.toLocaleString("da-DK")} i de ${HISTORY_WEEKS} foregående uger til sammenligning).`);
    renderReport(report);
  } catch (e) {
    if (e.session) { msg($("login-msg"), "err", "Din session er udløbet – log ind igen."); logout(); return; }
    if (e instanceof TypeError) { log("Netværks-/CORS-fejl:", e.message); msg($("fetch-msg"), "err", "Kunne ikke hente data (netværk eller CORS). Se teknisk log."); }
    else { log("Fejl:", e.message); msg($("fetch-msg"), "err", e.message); }
  } finally { btn.disabled = false; }
}

/* --------------------------- ANALYSIS --------------------------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (d) => d.split("-").reverse().join(".");
const pad = (n) => String(n).padStart(2, "0");
const fmtDT = (ms) => { const d = new Date(ms); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtD = (ms) => { const d = new Date(ms); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}`; };
const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
/* local midnight of "YYYY-MM-DD" + n days (DST safe) */
function dayStart(str, n = 0) { const [y, m, d] = str.split("-").map(Number); return new Date(y, m - 1, d + n).getTime(); }
function addDays(str, n) { return dayKey(dayStart(str, n)); }

const LAMP_CODES = new Set(["60005", "60006", "60007", "60010"]);
const COLOR_DA = { red: "rød", yellow: "gul", green: "grøn", amber: "gul" };

/* Turn one raw eDaptiva event into what the report needs */
function normalise(e) {
  const code = String(e.MessageCode || "").split(":").pop();
  const p = e.MessageParameters || [];
  const msgTxt = e.Message || "";
  let family, detail = "", comp = "";
  if (code === "60014") { family = "Detektorfejl"; comp = String(p[0] ?? (msgTxt.match(/'([^']*)'/) || [])[1] ?? ""); }
  else if (LAMP_CODES.has(code)) {
    family = "Lampefejl"; comp = "Signalgruppe " + (p[0] ?? (msgTxt.match(/Signal group:\s*([^,)]+)/) || [])[1] ?? "?");
    const col = code === "60010" ? "red" : ((msgTxt.match(/Color:\s*(\w+)/i) || [])[1] || "").toLowerCase();
    detail = COLOR_DA[col] || col;
  }
  else if (code === "60003") family = "Kritisk systemfejl";
  else if (code === "60001") family = "Strømforsyningsfejl";
  else if (code === "60026") family = "Tidsjustering (ur)";
  else if (code === "60024") family = "Omløbsovervågning";
  else if (code === "60037") family = "Busprioritering – modtagerfejl";
  else family = msgTxt || e.MessageCode || "Ukendt";

  const extra = (e.SecondaryEvents || []).map(s => {
    const m = s.Message || "";
    if (/Parasite voltage/i.test(m)) return "parasitspænding";
    const ina = m.match(/inactivity time:\s*(\d+)/i);
    if (ina) return "inaktivitet " + ina[1];
    return m;
  });
  const t = new Date(e.EventStampOn).getTime();
  const h = new Date(t).getHours();
  return { id: e.Id, t, ctrl: (e.ControllerName || "").trim() || "(ukendt)", sev: e.Severity, code, family, detail, comp,
           extra, night: h >= 22 || h < 6, msg: msgTxt, rawCode: e.MessageCode,
           key: [(e.ControllerName || "").trim(), family, comp].join("|") };
}

const faultLabel = (f) => f.comp ? `${f.family} – ${f.comp}` : f.family;

function analyse(rawEvents, from, to, sevs, crossings) {
  // de-duplicate (overlapping pages) and normalise
  const seen = new Set(), evs = [];
  for (const e of rawEvents) { const k = e.Id || JSON.stringify(e); if (!seen.has(k)) { seen.add(k); evs.push(normalise(e)); } }
  evs.sort((a, b) => a.t - b.t);

  const pStart = dayStart(from), pEnd = dayStart(to, 1), hStart = dayStart(from, -7 * HISTORY_WEEKS);
  const periodDays = Math.round((pEnd - pStart) / 864e5);
  const cur = evs.filter(e => e.t >= pStart && e.t < pEnd);
  const hist = evs.filter(e => e.t >= hStart && e.t < pStart);
  const weekIdx = (t) => Math.floor((pStart - t) / (7 * 864e5)); // 0 = week just before the period
  const baselinePerWeek = hist.length / HISTORY_WEEKS;

  /* ---- incidents: events on one crossing within INCIDENT_GAP_S seconds of each other ---- */
  const incidents = [];
  const byCtrlCur = {};
  for (const e of cur) (byCtrlCur[e.ctrl] = byCtrlCur[e.ctrl] || []).push(e);
  for (const [ctrl, list] of Object.entries(byCtrlCur)) {
    let inc = null;
    for (const e of list) {
      if (inc && e.t - inc.end <= INCIDENT_GAP_S * 1000) { inc.events.push(e); inc.end = e.t; }
      else { inc = { ctrl, start: e.t, end: e.t, events: [e] }; incidents.push(inc); }
      e.inc = inc;
    }
  }
  for (const inc of incidents) {
    const parts = [...new Set(inc.events.map(e => faultLabel(e)))];
    inc.signature = parts.sort((a, b) => (a.startsWith("Kritisk") ? 1 : 0) - (b.startsWith("Kritisk") ? 1 : 0)).join(" + ");
    inc.detectors = [...new Set(inc.events.filter(e => e.family === "Detektorfejl").map(e => e.comp))];
    inc.hasCrit = inc.events.some(e => e.family === "Kritisk systemfejl");
  }
  // repeating incident patterns (same crossing, same combination)
  const patterns = {};
  for (const inc of incidents) {
    const k = inc.ctrl + "|" + inc.signature;
    (patterns[k] = patterns[k] || { ctrl: inc.ctrl, signature: inc.signature, list: [] }).list.push(inc);
  }
  const patternList = Object.values(patterns).sort((a, b) => b.list.length - a.list.length);

  /* ---- faults (crossing + type + component) ---- */
  const faults = {};
  const mk = (e) => faults[e.key] = faults[e.key] || { key: e.key, ctrl: e.ctrl, family: e.family, comp: e.comp,
    cur: [], weeks: new Array(HISTORY_WEEKS).fill(0), histTotal: 0, sev: 0, details: {}, extras: {} };
  for (const e of cur) {
    const f = mk(e); f.cur.push(e); f.sev = Math.max(f.sev, e.sev);
    if (e.detail) f.details[e.detail] = (f.details[e.detail] || 0) + 1;
    for (const x of e.extra) f.extras[x.replace(/\d+$/, "").trim()] = (f.extras[x.replace(/\d+$/, "").trim()] || 0) + 1;
  }
  for (const e of hist) { const f = mk(e); const w = weekIdx(e.t); if (w >= 0 && w < HISTORY_WEEKS) f.weeks[w]++; f.histTotal++; }

  const faultList = Object.values(faults).map(f => {
    const n = f.cur.length;
    const wp = f.weeks.filter(x => x > 0).length;
    const days = new Set(f.cur.map(e => dayKey(e.t))).size;
    const avg = f.histTotal / HISTORY_WEEKS;
    const perWeek = n * 7 / periodDays;
    const status = [];
    if (n === 0) { if (wp >= 2) status.push("udbedret"); }
    else {
      if (n / periodDays > FLAP_PER_DAY) status.push("blinker");
      if (wp >= PERSIST_WEEKS) status.push("vedvarende");
      else if (wp >= 1) status.push("tilbagevendende");
      else status.push("ny");
      if (wp >= 1 && n >= 3 && perWeek > 2 * avg) status.push("stigende");
      if (n >= 3 || days >= 2) status.push("gentaget");
    }
    const nightShare = n ? f.cur.filter(e => e.night).length / n : 0;
    // how often this fault came together with a critical system error in the same incident
    const withCrit = f.family === "Kritisk systemfejl" ? 0 : f.cur.filter(e => e.inc && e.inc.hasCrit).length;
    return { ...f, n, wp, days, avg, status, nightShare, withCrit, last: n ? f.cur[n - 1].t : null, first: n ? f.cur[0].t : null };
  });
  const rank = (f) => (f.status.includes("blinker") ? -1 : f.status.includes("vedvarende") ? 0 : f.status.includes("stigende") ? 1 : f.status.includes("tilbagevendende") ? 2 : 3) * 1000 - f.n - (f.sev === 4 ? 500 : 0);
  const active = faultList.filter(f => f.n > 0).sort((a, b) => rank(a) - rank(b));
  const gone = faultList.filter(f => f.status.includes("udbedret")).sort((a, b) => b.wp - a.wp);

  /* ---- per crossing ---- */
  const ctrls = {};
  for (const name of crossings || []) ctrls[name] = ctrls[name] || { name, n: 0, crit: 0, err: 0, hist: 0 };
  for (const e of cur) { const c = ctrls[e.ctrl] = ctrls[e.ctrl] || { name: e.ctrl, n: 0, crit: 0, err: 0, hist: 0 }; c.n++; e.sev === 4 ? c.crit++ : c.err++; }
  for (const e of hist) { const c = ctrls[e.ctrl] = ctrls[e.ctrl] || { name: e.ctrl, n: 0, crit: 0, err: 0, hist: 0 }; c.hist++; }
  const ctrlList = Object.values(ctrls).map(c => ({ ...c, avg: c.hist / HISTORY_WEEKS, incidents: incidents.filter(i => i.ctrl === c.name).length }))
    .sort((a, b) => b.n - a.n || b.avg - a.avg);

  /* ---- weekly series: 8 previous weeks + the period ---- */
  const weekly = [];
  for (let w = HISTORY_WEEKS - 1; w >= 0; w--) {
    const s = pStart - (w + 1) * 7 * 864e5;
    weekly.push({ label: fmtD(s), count: hist.filter(e => weekIdx(e.t) === w).length, cur: false });
  }
  weekly.push({ label: "Periode", count: cur.length, cur: true });

  const flapping = active.filter(f => f.status.includes("blinker"));
  return { from, to, sevs, periodDays, cur, hist, flapping, crossingsTotal: crossings ? crossings.length : null, incidents, patternList, active, gone, ctrlList, weekly,
           baselinePerWeek, curPerWeek: cur.length * 7 / periodDays, insights: insights() };

  /* ---- automatic observations, most important first ---- */
  function insights() {
    const out = [];
    const flap = active.filter(f => f.status.includes("blinker"));
    if (flap.length) {
      const nFlap = flap.reduce((s, f) => s + f.n, 0);
      const byC = {};
      for (const f of flap) (byC[f.ctrl] = byC[f.ctrl] || []).push(f);
      out.push({ lvl: "crit", html: `<b>${flap.length} ${flap.length === 1 ? "fejl blinker" : "fejl blinker"}</b> (mere end ${FLAP_PER_DAY} gange pr. døgn) og står for <b>${Math.round(nFlap / cur.length * 100)} % af alle hændelser</b> i perioden: ` +
        Object.entries(byC).map(([c, l]) => `${esc(c)} (${l.map(f => `${esc(f.comp || f.family)} ${f.n.toLocaleString("da-DK")}×`).join(", ")})`).join("; ") +
        `. En detektor der blinker skifter typisk mellem fejl og OK hele tiden – det skal udbedres på stedet, og indtil da drukner andre fejl i støjen.` });
    }
    for (const p of patternList.filter(p => p.list.length >= 3 && p.list.some(i => i.events.length >= 2) && p.list[0].detectors.length < 3).slice(0, 4)) {
      const days = [...new Set(p.list.map(i => fmtD(i.start)))];
      const hasCrit = p.signature.includes("Kritisk systemfejl") && p.signature.includes("+");
      const evs = p.list.flatMap(i => i.events);
      const extras = [...new Set(evs.flatMap(e => e.extra.map(x => x.replace(/\d+$/, "").trim())))];
      out.push({ lvl: evs.some(e => e.sev === 4) ? "crit" : "warn",
        html: `<b>${esc(p.ctrl)}:</b> ${esc(p.signature)} gentog sig <b>${p.list.length} gange</b> (${esc(days.join(", "))}).` +
          (extras.length ? ` Ekstra info: ${esc(extras.join(", "))}.` : "") +
          (hasCrit ? " Kritisk systemfejl kommer i samme sekund som den anden fejl – sandsynligvis en følgefejl, så det er én fejl at udbedre, ikke to." : "") });
    }
    const bursts = {};
    for (const inc of incidents) if (inc.detectors.length >= 3) (bursts[inc.ctrl] = bursts[inc.ctrl] || []).push(inc);
    for (const [ctrl, list] of Object.entries(bursts).sort((a, b) => b[1].length - a[1].length).slice(0, 3)) {
      const big = list.reduce((m, i) => i.detectors.length > m.detectors.length ? i : m, list[0]);
      out.push({ lvl: "warn", html: `<b>${esc(ctrl)}:</b> ` + (list.length === 1
        ? `${big.detectors.length} detektorer faldt ud inden for ${Math.round((big.end - big.start) / 1000)} sek. den ${esc(fmtDT(big.start))} (${esc(big.detectors.join(", "))}).`
        : `${list.length} gange faldt 3 eller flere detektorer ud samtidig – fx ${big.detectors.length} detektorer den ${esc(fmtDT(big.start))} (${esc(big.detectors.slice(0, 8).join(", "))}${big.detectors.length > 8 ? " …" : ""}).`) +
        ` Når flere detektorer fejler samtidig, tyder det på en fælles årsag frem for fejl på de enkelte detektorer.` });
    }
    const persist = {};
    for (const f of active.filter(f => f.status.includes("vedvarende"))) (persist[f.ctrl + "|" + f.family] = persist[f.ctrl + "|" + f.family] || []).push(f);
    for (const list of Object.values(persist).slice(0, 5)) {
      const f0 = list[0];
      const items = list.map(f => `${f.comp || f.family} (${f.wp}/${HISTORY_WEEKS} uger, ${f.n}× nu)`).join(", ");
      out.push({ lvl: "crit", html: list.length === 1
        ? `<b>${esc(f0.ctrl)} – ${esc(faultLabel(f0))}:</b> har været der i <b>${f0.wp} af de ${HISTORY_WEEKS} foregående uger</b> og igen i perioden (${f0.n}×). Fejlen er ikke forsvundet af sig selv.`
        : `<b>${esc(f0.ctrl)} – ${list.length} ${esc(f0.family.toLowerCase())} der bliver ved med at komme igen:</b> ${esc(items)}. De har været der i mindst ${PERSIST_WEEKS} af de ${HISTORY_WEEKS} foregående uger og er ikke forsvundet af sig selv.` });
    }
    for (const f of active.filter(f => f.status.includes("stigende") && !f.status.includes("vedvarende")).slice(0, 3)) {
      out.push({ lvl: "warn", html: `<b>${esc(f.ctrl)} – ${esc(faultLabel(f))}:</b> stigende – ${f.n}× i perioden mod normalt ${f.avg.toFixed(1)} pr. uge.` });
    }
    for (const f of active.filter(f => f.n >= 3 && f.nightShare >= 0.75).slice(0, 3)) {
      out.push({ lvl: "", html: `<b>${esc(f.ctrl)} – ${esc(faultLabel(f))}:</b> ${Math.round(f.nightShare * 100)} % af hændelserne sker om natten (22–06).` });
    }
    if (gone.length) out.push({ lvl: "", html: `${gone.length} fejl, som var der i flere af de foregående uger, er <b>ikke set i perioden</b> (muligvis udbedret) – se listen nederst.` });
    if (hist.length) {
      const pct = cur.length && cur.length * 7 / periodDays;
      out.push({ lvl: "", html: `Perioden har ${cur.length.toLocaleString("da-DK")} hændelser (${Math.round(cur.length * 7 / periodDays).toLocaleString("da-DK")} pr. uge) mod gennemsnitligt ${Math.round(baselinePerWeek).toLocaleString("da-DK")} pr. uge de ${HISTORY_WEEKS} foregående uger.` });
    } else {
      out.push({ lvl: "", html: `Der er ingen hændelser i de ${HISTORY_WEEKS} foregående uger, så der kan ikke sammenlignes bagud.` });
    }
    return out;
  }
}

/* --------------------------- RENDER --------------------------- */
function spark(weeks, now) {
  const vals = [...weeks].reverse().concat([now]);
  const mx = Math.max(1, ...vals);
  return `<span class="spark" title="Uge for uge, ældste → periode: ${vals.join(" / ")}">` +
    vals.map((v, i) => `<span class="${i === vals.length - 1 ? "cur" : v ? "" : "z"}" style="height:${v ? Math.max(3, v / mx * 20) : 2}px"></span>`).join("") + "</span>";
}

function weeklyChart(weekly) {
  const W = 760, H = 190, L = 46, B = 30, T = 16, n = weekly.length, ih = H - B - T, cw = (W - L) / n, bw = cw * 0.6;
  const mx = Math.max(5, ...weekly.map(w => w.count));
  const top = mx <= 10 ? Math.ceil(mx / 2) * 2 : Math.ceil(mx / 10) * 10;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Hændelser pr. uge">`;
  for (const v of [0, top / 2, top]) { const y = T + ih - v / top * ih; s += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#e2e6ea"/><text x="${L - 6}" y="${y + 4}" font-size="11" fill="#79838d" text-anchor="end">${v}</text>`; }
  weekly.forEach((w, i) => {
    const x = L + i * cw + (cw - bw) / 2, cx = L + i * cw + cw / 2, h = w.count / top * ih, y = T + ih - h;
    if (h > 0) s += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${w.cur ? "#1f4f86" : "#7ea3cf"}"><title>${w.label}: ${w.count}</title></rect>`;
    s += `<text x="${cx}" y="${y - 4}" font-size="11" fill="#4a545e" text-anchor="middle">${w.count}</text>`;
    s += `<text x="${cx}" y="${H - B + 16}" font-size="11" fill="#4a545e" text-anchor="middle" ${w.cur ? 'font-weight="700"' : ""}>${w.label}</text>`;
  });
  return s + `<line x1="${L}" x2="${W}" y1="${T + ih}" y2="${T + ih}" stroke="#79838d"/></svg>`;
}

function delta(n, base) {
  if (!base) return n ? "ingen de foregående uger" : "";
  const pct = (n - base) / base * 100;
  const cls = pct > 15 ? "up" : pct < -15 ? "down" : "";
  return `<span class="${cls}">${pct > 0 ? "▲" : pct < 0 ? "▼" : ""} ${Math.abs(pct).toFixed(0)} %</span> ift. snit ${base >= 100 ? Math.round(base).toLocaleString("da-DK") : base.toFixed(1)}/uge`;
}

function renderReport(r) {
  const site = state.site, now = new Date();
  const badge = (s) => `<span class="badge b-${s}">${{ blinker: "blinker", vedvarende: "vedvarende", stigende: "stigende", tilbagevendende: "tilbagevendende", ny: "ny", gentaget: "gentaget", udbedret: "ikke set nu" }[s]}</span>`;
  const sevTxt = r.sevs.map(s => SEVERITY[s]).join(" + ");
  let h = `<div class="rep-head"><h2>Fejlrapport – ${esc(r.area || site.name)}</h2>
    <div class="sub">${r.area ? esc(site.name.replace(/ \(.*\)$/, "")) + " · " : ""}Periode ${fmtDate(r.from)} – ${fmtDate(r.to)} · Alvorlighed: ${esc(sevTxt)} · Sammenlignet med de ${HISTORY_WEEKS} foregående uger · Lavet ${now.toLocaleString("da-DK")}</div></div>`;

  const crit = r.cur.filter(e => e.sev === 4).length;
  const repeating = r.active.filter(f => f.status.includes("vedvarende") || f.status.includes("tilbagevendende")).length;
  h += `<div class="tiles">
    <div class="tile"><div class="k">Hændelser i perioden</div><div class="v">${r.cur.length.toLocaleString("da-DK")}</div><div class="d">${delta(r.curPerWeek, r.baselinePerWeek)}</div></div>
    <div class="tile"><div class="k">Heraf Critical error</div><div class="v">${crit}</div><div class="d">${r.cur.length - crit} Error</div></div>
    ${r.crossingsTotal ? `<div class="tile"><div class="k">Kryds uden fejl</div><div class="v">${r.crossingsTotal - r.ctrlList.filter(c => c.n).length} af ${r.crossingsTotal}</div><div class="d">i perioden</div></div>` : ""}
    <div class="tile"><div class="k">Forskellige fejl</div><div class="v">${r.active.length}</div><div class="d">på ${r.ctrlList.filter(c => c.n).length} kryds · ${r.incidents.length} samlede hændelsesforløb</div></div>
    <div class="tile"><div class="k">Fejl der kommer igen</div><div class="v">${repeating}</div><div class="d">set også i tidligere uger</div></div>
  </div>`;

  h += `<h3>Vigtigste observationer</h3><ul class="insights">${r.insights.map(i => `<li class="${i.lvl}">${i.html}</li>`).join("")}</ul>`;

  h += `<h3>Fejl i perioden – og om de har været der før</h3>
    <p class="note">Én række = samme fejl på samme kryds (fx samme detektor eller signalgruppe). Søjlerne viser antal pr. uge de ${HISTORY_WEEKS} foregående uger og perioden (mørk).
    <b>blinker</b> = mere end ${FLAP_PER_DAY} gange pr. døgn · <b>vedvarende</b> = set i mindst ${PERSIST_WEEKS} af ${HISTORY_WEEKS} uger · <b>tilbagevendende</b> = set 1–${PERSIST_WEEKS - 1} af ${HISTORY_WEEKS} uger · <b>ny</b> = ikke set i de ${HISTORY_WEEKS} uger · <b>gentaget</b> = flere gange eller flere dage i perioden.</p>
    <div class="tablewrap"><table><thead><tr><th>Kryds</th><th>Fejl</th><th class="n">Antal</th><th class="n">Dage</th><th>Uge for uge</th><th class="n">Uger før</th><th>Status</th><th>Ekstra info</th><th>Senest</th></tr></thead><tbody>` +
    r.active.map(f => `<tr><td>${esc(f.ctrl)}</td><td>${f.sev === 4 ? '<span class="sev sev-4">Critical</span> ' : ""}${esc(f.family)}${f.comp ? ` <code>${esc(f.comp)}</code>` : ""}${
        Object.keys(f.details).length ? `<br><span class="small">${esc(Object.entries(f.details).map(([k, v]) => `${k} ${v}×`).join(", "))}</span>` : ""}${
        f.withCrit ? `<br><span class="small">${f.withCrit}× sammen med kritisk systemfejl</span>` : ""}</td>
      <td class="n"><b>${f.n.toLocaleString("da-DK")}</b></td><td class="n">${f.days}</td><td>${spark(f.weeks, f.n)}</td><td class="n">${f.wp}/${HISTORY_WEEKS}</td>
      <td>${f.status.map(badge).join("")}</td><td class="small">${esc(Object.entries(f.extras).map(([k, v]) => `${k} (${v})`).join(", "))}</td><td>${esc(fmtDT(f.last))}</td></tr>`).join("") +
    `</tbody></table></div>`;

  const multi = r.patternList.filter(p => p.list.some(i => i.events.length >= 2)).slice(0, 25);
  if (multi.length) {
    h += `<h3>Fejl der kommer sammen</h3>
      <p class="note">Hændelser på samme kryds inden for ${INCIDENT_GAP_S} sekunder er samlet til ét forløb. Det viser, hvilke fejl der kommer sammen (fx en lampefejl der udløser en kritisk systemfejl).</p>
      <div class="tablewrap"><table><thead><tr><th>Kryds</th><th>Forløb</th><th class="n">Gange</th><th>Tidspunkter</th></tr></thead><tbody>` +
      multi.map(p => `<tr><td>${esc(p.ctrl)}</td><td>${esc(p.signature)}${p.list[0].detectors.length > 1 ? `<br><span class="small">${esc(p.list[0].detectors.join(", "))}</span>` : ""}</td><td class="n"><b>${p.list.length}</b></td>
        <td class="small">${esc(p.list.slice(0, 12).map(i => fmtDT(i.start)).join(" · "))}${p.list.length > 12 ? " …" : ""}</td></tr>`).join("") + `</tbody></table></div>`;
  }

  h += `<h3>Udvikling uge for uge</h3>${weeklyChart(r.weekly)}
    <p class="small">Ugerne er de ${HISTORY_WEEKS} hele uger før periodens start (dato = ugens første dag).${r.periodDays !== 7 ? ` Perioden er ${r.periodDays} dage.` : ""}</p>`;

  h += `<h3>Pr. kryds</h3><div class="tablewrap"><table><thead><tr><th>Kryds</th><th class="n">I perioden</th><th class="n">Critical</th><th class="n">Error</th><th class="n">Forløb</th><th class="n">Snit/uge før</th></tr></thead><tbody>` +
    r.ctrlList.filter(c => (r.crossingsTotal && r.crossingsTotal <= 40) || c.n > 0 || c.avg >= 0.5).map(c => `<tr><td>${esc(c.name)}</td><td class="n"><b>${c.n.toLocaleString("da-DK")}</b></td><td class="n">${c.crit.toLocaleString("da-DK")}</td><td class="n">${c.err.toLocaleString("da-DK")}</td><td class="n">${c.incidents}</td><td class="n">${c.avg.toFixed(1)}</td></tr>`).join("") +
    `</tbody></table></div>`;

  if (r.gone.length) {
    h += `<h3>Fejl der ikke er set i perioden</h3><p class="note">Var der i mindst 2 af de ${HISTORY_WEEKS} foregående uger, men ikke i perioden – muligvis udbedret.</p>
      <div class="tablewrap"><table><thead><tr><th>Kryds</th><th>Fejl</th><th>Uge for uge</th><th class="n">Uger før</th></tr></thead><tbody>` +
      r.gone.map(f => `<tr><td>${esc(f.ctrl)}</td><td>${esc(faultLabel(f))}</td><td>${spark(f.weeks, 0)}</td><td class="n">${f.wp}/${HISTORY_WEEKS}</td></tr>`).join("") + `</tbody></table></div>`;
  }

  const shown = r.cur.length > EVENT_LIST_MAX ? r.cur.slice(-EVENT_LIST_MAX) : r.cur;
  h += `<h3>Alle hændelser i perioden</h3><details><summary class="noprint">Vis ${r.cur.length > EVENT_LIST_MAX ? `de seneste ${EVENT_LIST_MAX} af ${r.cur.length.toLocaleString("da-DK")}` : r.cur.length} hændelser</summary><div class="tablewrap"><table>
    <thead><tr><th>Tidspunkt</th><th>Kryds</th><th>Alvorlighed</th><th>Besked</th><th>Ekstra info</th></tr></thead><tbody>` +
    [...shown].reverse().map(e => `<tr><td>${esc(new Date(e.t).toLocaleString("da-DK"))}</td><td>${esc(e.ctrl)}</td><td><span class="sev sev-${e.sev}">${esc(SEVERITY[e.sev] || e.sev)}</span></td>
      <td>${esc(e.msg)} <span class="small">${esc(e.rawCode)}</span></td><td class="small">${esc(e.extra.join(", "))}</td></tr>`).join("") + `</tbody></table></div></details>`;

  $("report").innerHTML = h;
  $("result").classList.remove("hidden");
}

function downloadJson() {
  if (!state.data) return;
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `edaptiva_${state.data.site}_${state.data.from}_${state.data.to}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* --------------------------- START --------------------------- */
(function init() {
  const sel = $("site");
  let last = null; try { last = localStorage.getItem("edaptiva-last-site"); } catch (e) {}
  for (const s of SITES) { const o = document.createElement("option"); o.value = s.id; o.textContent = s.name; if (s.id === last) o.selected = true; sel.appendChild(o); }
  if (SITES.length === 1) sel.closest("form").querySelector('label[for=site]').classList.add("hidden"), sel.classList.add("hidden");

  const today = new Date(), wk = new Date(today.getTime() - 7 * 864e5);
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  $("to").value = ymd(new Date(today.getTime() - 864e5)); $("from").value = ymd(wk);

  $("login-form").addEventListener("submit", login);
  $("query-form").addEventListener("submit", fetchEvents);
  $("logout-btn").addEventListener("click", logout);
  $("dl-json").addEventListener("click", downloadJson);
  $("print-btn").addEventListener("click", () => window.print());

  try {  // stay logged in when the page is reloaded (same tab, key is valid for ~1 hour)
    const s = JSON.parse(sessionStorage.getItem("edaptiva-session") || "null");
    const site = s && SITES.find(x => x.id === s.site);
    if (site) { Object.assign(state, { site, token: s.token, deviceId: s.deviceId, user: s.user }); showApp(); }
  } catch (e) {}
  log("Side klar. Kommuner:", SITES.map(s => s.id).join(", "));
})();
</script>
</body>
